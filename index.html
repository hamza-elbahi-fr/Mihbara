<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mihbara · Espace pédagogique de français</title>
<meta name="description" content="Fiches pédagogiques, cours de langue, contrôles et outils pour le français au lycée qualifiant marocain, conformes aux orientations pédagogiques de 2007.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>/* Plan : l’encre et le cahier. Bleu encre profond pour la structure, bleu Majorelle pour l’action,
   ocre pour les repères. Barre latérale de navigation, documents imprimables au centre. */
:root{
  --paper:#f3f4f8; --surface:#ffffff; --sunk:#eceef4; --ink:#16203a; --muted:#5a6580; --line:#d9dde8;
  --accent:#2d45c4; --accent-soft:#e6e9fb; --on-accent:#ffffff; --ochre:#b9790b; --ochre-soft:#fbf1dc;
  --good:#1d7a52; --good-soft:#e2f3ea; --warn:#a86300; --warn-soft:#fdf0dc; --bad:#b23a2c; --bad-soft:#fbe6e3;
  --side:#16203a; --side-ink:#d8ddef; --side-muted:#8e98b6; --side-hover:#22305a;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --surface:#171e33; --sunk:#121829; --ink:#e6e9f4; --muted:#9aa4c0; --line:#2b3553;
  --accent:#7d8ff0; --accent-soft:#232c55; --on-accent:#0f1424; --ochre:#e3a63a; --ochre-soft:#3a2c12;
  --good:#4cc08b; --good-soft:#15342a; --warn:#e7a54a; --warn-soft:#3a2a12; --bad:#ec7a6a; --bad-soft:#3d1c19;
  --side:#0b1020; --side-ink:#d8ddef; --side-muted:#7e88a6; --side-hover:#1b2442; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1424; --surface:#171e33; --sunk:#121829; --ink:#e6e9f4; --muted:#9aa4c0; --line:#2b3553;
  --accent:#7d8ff0; --accent-soft:#232c55; --on-accent:#0f1424; --ochre:#e3a63a; --ochre-soft:#3a2c12;
  --good:#4cc08b; --good-soft:#15342a; --warn:#e7a54a; --warn-soft:#3a2a12; --bad:#ec7a6a; --bad-soft:#3d1c19;
  --side:#0b1020; --side-ink:#d8ddef; --side-muted:#7e88a6; --side-hover:#1b2442; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.55 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
/* barre latérale */
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 16px;text-decoration:none;color:inherit}
.brand b{font:600 26px/1 var(--f-display);letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--ochre)}
.brand span{font-size:12.5px;color:var(--side-muted)}
.nav-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--accent);color:#fff}
.nav a .lv{font:600 11px/1 var(--f-body);border:1px solid currentColor;border-radius:5px;padding:3px 5px;min-width:44px;text-align:center;opacity:.85}
.side-foot{margin-top:18px;padding:10px;border-top:1px solid var(--side-hover);display:grid;gap:8px}
.side-foot button{background:transparent;border:1px solid var(--side-hover);color:var(--side-ink);border-radius:8px;padding:7px 10px;text-align:left;font-size:14px}
.side-foot button:hover{background:var(--side-hover)}
.topbar{display:none}
main{min-width:0;padding:26px 30px 70px}
.wrap{max-width:1120px;margin:0 auto}
/* composants */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(28px,4vw,40px)}
.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--muted)}
.lvcard{border-top:5px solid var(--accent);display:flex;flex-direction:column;gap:10px}
.lvcard .works{display:flex;flex-direction:column;gap:4px;font-size:15px}
.lvcard .works span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--ochre);margin-right:8px;vertical-align:middle}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.och{background:var(--ochre-soft);color:var(--ochre)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-left:6px solid var(--ochre)}
.kpi .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:600 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin:4px 0}
.kpi .s{font-size:14px;color:var(--muted)}
.hero{background:var(--side);color:#eef1fb;border-radius:18px;padding:28px 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:22px}
.hero h1{font-size:clamp(28px,4vw,42px);color:#fff}
.hero p{color:#c4cbe3;max-width:56ch;margin:10px 0 16px}
.hero ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;color:#d6dbef}
.hero ul li{padding-left:22px;position:relative}
.hero ul li::before{content:"✓";position:absolute;left:0;color:var(--ochre)}
.sec{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{font-size:24px}
.sec .note{color:var(--muted);font-size:14px}
table.t{width:100%;border-collapse:collapse;background:var(--surface);font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-weight:700}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tw table.t{border:0}
label.l{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
textarea.i{min-height:120px;resize:vertical}
.form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.help{font-size:13.5px;color:var(--muted);margin-top:4px}
.seqs{display:grid;gap:12px}
.seq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:60px 1fr;gap:14px}
.seq .n{font:600 34px/1 var(--f-display);color:var(--ochre);font-variant-numeric:tabular-nums}
.seq h3{font-size:19px}
.seq .sup{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);min-width:150px;flex:1;max-width:260px}
.act:hover{border-color:var(--accent);background:var(--accent-soft)}
.act b{font-size:14.5px}
.act small{color:var(--muted);font-size:12.5px;line-height:1.35}
.act.ed{border-color:var(--good)}
/* document (fiche) */
.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.doclayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.doclayout.solo{grid-template-columns:minmax(0,1fr)}
.doc{background:#fff;color:#16203a;border:1px solid var(--line);border-radius:6px;padding:34px 38px;box-shadow:0 1px 0 rgba(0,0,0,.03);font:400 15px/1.5 "Source Sans 3",Calibri,Arial,sans-serif;max-width:900px;margin:0 auto;width:100%}
.doc h1{font:700 22px/1.2 "Source Sans 3",Calibri,Arial,sans-serif;text-align:center;margin:8px 0 2px;color:#1b2b6b}
.doc h2{font:700 15.5px/1.3 "Source Sans 3",Calibri,Arial,sans-serif;margin:18px 0 6px;color:#1b2b6b;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #1b2b6b;padding-bottom:3px}
.doc .ent{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;font-size:12.5px;line-height:1.35;border-bottom:1px solid #c9cfdd;padding-bottom:10px}
.doc .ent .ar{text-align:right;direction:rtl;font-family:"Noto Naskh Arabic","Traditional Arabic",Arial,sans-serif;font-size:13.5px}
.doc .ent .mid{text-align:center;font-weight:700}
.doc .sub{text-align:center;color:#55607a;font-size:13.5px;margin-bottom:10px}
.doc table{width:100%;border-collapse:collapse;margin:6px 0}
.doc th,.doc td{border:1px solid #9aa3b8;padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:#e8ecf7;font-weight:700;color:#1b2b6b}
.doc td.lab{background:#f4f6fb;font-weight:700;width:26%;color:#1b2b6b}
.doc ul,.doc ol{margin:4px 0;padding-left:22px}
.doc .qcm{display:grid;gap:6px;margin:4px 0}
.doc .qcm div{break-inside:avoid}
.doc .qcm span{display:inline-block;margin-right:14px}
.doc .small{font-size:12.5px;color:#55607a}
.doc .corr{background:#f6f8ee;border:1px dashed #9db06a;padding:8px 10px;border-radius:4px;margin-top:6px}
[contenteditable]{outline:none;border-radius:3px;min-height:1.2em}
.editing [contenteditable]:hover{background:#fff8e4;box-shadow:0 0 0 1px #e9c97a}
.editing [contenteditable]:focus{background:#fff4d3;box-shadow:0 0 0 2px #d9a63a}
.ctl{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.ctl button{border:1px solid #c9cfdd;background:#fff;border-radius:5px;font-size:12px;padding:1px 6px;color:#1b2b6b}
.side-panel{position:sticky;top:70px;display:grid;gap:12px}
.check{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.check h3{font-size:18px;margin-bottom:6px}
.score{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--f-display);font-variant-numeric:tabular-nums;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ck{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ck .m{font-weight:700}
.ck.ok .m{color:var(--good)}.ck.no .m{color:var(--bad)}
.ck small{display:block;color:var(--muted);font-size:12.5px}
.analysis{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.dom .tr i{background:var(--ochre)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.ex .q{font-weight:600}
.ex .opts{display:flex;gap:8px;flex-wrap:wrap}
.ex .opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.ex .opts button.ok{background:var(--good);border-color:var(--good);color:#fff}
.ex .opts button.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ex .fb{font-size:14.5px;color:var(--muted)}
.cours{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;max-width:80ch}
.cours ul{padding-left:20px}
.cal{display:grid;gap:8px}
.cal .ev{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cal .ev.past{opacity:.55}
.cal .ev.next{border-color:var(--ochre);box-shadow:inset 5px 0 0 var(--ochre)}
.cal .ev .d{font-variant-numeric:tabular-nums;font-weight:600}
.edt{display:grid;grid-template-columns:90px repeat(6,1fr);gap:4px;font-size:13.5px}
.edt div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:34px}
.edt .h{background:var(--sunk);font-weight:700;text-align:center}
.edt .c{background:var(--accent-soft);border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(10,14,28,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px}
.modal .box h2{font-size:22px}
.qr{background:#fff;padding:10px;border-radius:10px;width:220px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:92vw}
.empty{border:2px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}
.notes input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.notes td.avg{font-weight:700;font-variant-numeric:tabular-nums}
.badge-ok{color:var(--good);font-weight:700}
.badge-ko{color:var(--bad);font-weight:700}
@media (max-width:1100px){.doclayout{grid-template-columns:1fr}.side-panel{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:30}
  .topbar b{font:600 22px var(--f-display)}
  .topbar b i{font-style:normal;color:var(--ochre)}
  .topbar button{background:transparent;border:1px solid #3a4670;color:#fff;border-radius:8px;padding:5px 10px}
  main{padding:18px 16px 60px}
  .hero{grid-template-columns:1fr;padding:22px}
  .doc{padding:20px 16px}
  .doc .ent{grid-template-columns:1fr}
  .doc .ent .ar{text-align:left;direction:rtl}
  .seq{grid-template-columns:1fr}
  .cal .ev{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .side,.topbar,.toolbar,.side-panel,.noprint,.ctl,.toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .doclayout{display:block}
  .doc{border:0;box-shadow:none;padding:0;max-width:none}
  .editing [contenteditable]:hover{background:none;box-shadow:none}
  .doc h2,.doc table{break-inside:auto}
  .doc tr{break-inside:avoid}
}
</style>
</head>

<script>/* Programme de français du cycle secondaire qualifiant (OP 2007) : modules, séquences, contenus de séance */
const PROGRAM = [
{ id:"tc", name:"Tronc commun", short:"TC", tahaddi:"Tronc commun",
  intro:"Mise à niveau, typologie textuelle, nouvelle réaliste, nouvelle fantastique et théâtre classique.",
  modules:[
  { id:"tc-m1", t:"Textes divers autour de la typologie textuelle", o:"Typologie textuelle", a:"Textes variés", d:"", g:"Corpus de textes", sem:"S1",
    obj:"Mise à niveau et consolidation des acquis antérieurs (collège).",
    comp:["Lire méthodiquement des textes divers et identifier leur type dominant.","Identifier les genres et sous-genres littéraires (roman, nouvelle, théâtre, autobiographie, image).","Produire des textes narratifs, descriptifs, argumentatifs et injonctifs courts.","Déceler les valeurs humaines et universelles véhiculées par les textes."],
    ctx:["Évaluation diagnostique en début de module","Textes du domaine public proposés comme supports, remplaçables par l’enseignant","Image fixe (portrait, photographie, affiche, BD) en activité orale"],
    seqs:[
     {t:"Genres littéraires et types de textes", sup:"Corpus de cinq courts extraits (récit, description, discours, recette, dialogue de théâtre)",
      obj:"Distinguer le genre d’un texte (forme) et son type dominant (visée).",
      q:["Classez les extraits selon leur forme : prose, vers, dialogue théâtral.","Pour chaque extrait, dites ce que l’auteur cherche à faire : raconter, décrire, convaincre, ordonner ou expliquer.","Relevez dans chaque extrait deux indices qui justifient votre réponse.","Quel extrait mélange plusieurs types ? Lequel domine ?","Proposez un tableau récapitulatif genre / type / indices."],
      syn:"Le genre renvoie à la forme d’un texte (roman, nouvelle, théâtre, poésie) ; le type renvoie à sa visée (narratif, descriptif, argumentatif, injonctif, explicatif). Un même texte peut combiner plusieurs types, mais l’un d’eux domine.",
      lg:"types", lo:"Identifier les indices linguistiques propres à chaque type de texte.",
      or:["Lecture et analyse de l’image","Présenter un portrait ou une photographie : cadrage, plans, couleurs, message."],

  { id:"tc-m2", t:"Lire une nouvelle réaliste", o:"Aux champs", a:"Guy de Maupassant", d:"1882", g:"Nouvelle réaliste", sem:"S1",
    obj:"Lire et analyser une nouvelle réaliste du XIXe siècle.",
    comp:["Identifier les caractéristiques de la nouvelle réaliste.","Analyser le schéma narratif et le système des personnages.","Repérer la critique sociale et les valeurs véhiculées.","Produire un récit et un texte argumentatif en lien avec l’œuvre."],
    ctx:["Guy de Maupassant (1850-1893), disciple de Flaubert","Le réalisme et le naturalisme","La paysannerie normande au XIXe siècle","Lecture complémentaire : « La Ficelle » (1883)"],
    seqs:[
     {t:"Présentation de l’œuvre et de l’auteur", sup:"Paratexte, biographie de Maupassant, définition de la nouvelle réaliste",
      obj:"Situer l’œuvre dans son contexte et formuler des hypothèses de lecture.",
      q:["Que suggère le titre « Aux champs » sur le cadre de l’histoire ?","Qui est Guy de Maupassant ? Situez-le dans son siècle et son mouvement littéraire.","Qu’est-ce qu’une nouvelle ? En quoi se distingue-t-elle du roman ?","Quelles sont les caractéristiques du réalisme ?","Formulez une hypothèse sur le sujet de la nouvelle."],
      syn:"« Aux champs », publiée en 1882, est une nouvelle réaliste : un récit bref, centré sur un événement, qui peint avec précision la vie de paysans normands et porte un regard critique sur la société.",
      lg:"types", lo:"Réactiver les notions de genre et de type de texte à partir du paratexte.",
      or:["Exposé","Présenter la vie et l’œuvre de Maupassant en cinq minutes, à l’aide d’une fiche."],
      ec:["Fiche de lecture","Rédigez la fiche d’identité de la nouvelle : auteur, date, genre, personnages, lieux, thème."]},
     {t:"La situation initiale : deux familles de paysans", sup:"Début de la nouvelle : les Tuvache et les Vallin",
      obj:"Analyser la situation initiale et le portrait des deux familles.",
      q:["Où et quand se situe l’action ?","Comment le narrateur présente-t-il les deux familles ? Relevez les ressemblances.","Relevez les détails qui montrent la pauvreté des paysans.","Quel est l’effet produit par la répétition et la symétrie dans la description des familles ?","Quel point de vue le narrateur adopte-t-il ?"],
      syn:"La situation initiale présente deux familles voisines, pauvres et presque identiques. Cette symétrie prépare l’opposition à venir et donne à la nouvelle sa valeur de démonstration.",
      lg:"temps", lo:"Identifier les valeurs de l’imparfait dans la situation initiale.",
      or:["Lecture et analyse de l’image","Comparer un tableau réaliste de paysans (Millet) et la description de Maupassant."],
      ec:["Texte descriptif","Décrivez une famille de votre village ou de votre quartier à la manière de Maupassant."]},
     {t:"L’élément perturbateur : la proposition des d’Hubières", sup:"L’arrivée de M. et Mme d’Hubières et leurs deux propositions",
      obj:"Analyser l’élément perturbateur et les réactions opposées des deux familles.",
      q:["Que demandent M. et Mme d’Hubières ? Que proposent-ils en échange ?","Comment réagit la mère Tuvache ? Relevez ses paroles.","Pourquoi les Vallin acceptent-ils ?","Relevez les marques du parler paysan dans le dialogue : quel effet produisent-elles ?","Que révèle cette scène sur la relation entre riches et pauvres ?"],
      syn:"L’arrivée des d’Hubières rompt l’équilibre : les Tuvache refusent de vendre leur enfant au nom de la dignité, les Vallin acceptent contre une rente. Le dialogue, qui reproduit le parler paysan, rend la scène vivante et réaliste.",
      lg:"discours", lo:"Transformer un dialogue du discours direct au discours indirect.",
      or:["Débat","L’argent peut-il tout acheter ? Débat organisé en deux camps."],
      ec:["Dialogue","Réécrivez la scène du refus des Tuvache en imaginant une autre réaction de la mère."]},
     {t:"Le dénouement : le retour de Jean et la révolte de Charlot", sup:"Fin de la nouvelle : retour de Jean Vallin, départ de Charlot Tuvache",
      obj:"Analyser le dénouement et le renversement final.",
      q:["Comment Jean Vallin revient-il au village ? Comment est-il accueilli ?","Que reproche Charlot Tuvache à ses parents ?","Relevez les phrases exclamatives de Charlot : quels sentiments expriment-elles ?","En quoi la fin est-elle ironique par rapport au choix initial des Tuvache ?","Quelle morale peut-on dégager de la nouvelle ?"],
      syn:"Le dénouement renverse les valeurs : le fils vendu revient riche, et le fils gardé reproche à ses parents de l’avoir « gardé » dans la misère. Maupassant laisse au lecteur le soin de juger, par une chute ironique.",
      lg:"phrases", lo:"Identifier les types et formes de phrases et leur valeur expressive.",
      or:["Débat","Charlot a-t-il raison de reprocher à ses parents leur choix ?"],
      ec:["Suite de récit","Imaginez la vie de Charlot Tuvache après son départ du village."]},
     {t:"Le réalisme et la visée de la nouvelle", sup:"Relecture de l’œuvre intégrale et de « La Ficelle »",
      obj:"Dégager les procédés réalistes et la critique sociale de l’œuvre.",
      q:["Relevez trois procédés qui donnent l’illusion du réel.","Quelles classes sociales s’opposent dans la nouvelle ?","Quelle image Maupassant donne-t-il des paysans ? Est-elle valorisante ?","Comparez « Aux champs » et « La Ficelle » : quels points communs ?","Selon vous, quel message l’auteur veut-il transmettre ?"],
      syn:"Par la précision des détails, le parler paysan et la brièveté du récit, Maupassant fait œuvre réaliste. Il dénonce la misère paysanne et le pouvoir de l’argent, sans commentaire explicite : la critique naît des faits.",
      lg:"niveaux", lo:"Reconnaître les niveaux de langue et leur fonction dans le récit.",
      or:["Exposé","Présenter oralement une autre nouvelle de Maupassant."],
      ec:["Résumé","Résumez « Aux champs » en dix lignes, en respectant l’ordre des événements."]}
    ],

  { id:"tc-m4", t:"Lire une pièce de théâtre classique", o:"Le Bourgeois gentilhomme", a:"Molière", d:"1670", g:"Comédie-ballet", sem:"S2",

      ec:["Fiche de lecture","Rédigez la fiche d’identité de la pièce."]},

      syn:"M. Jourdain veut acquérir les manières de la noblesse. Ses leçons révèlent sa naïveté : il découvre qu’il « fait de la prose » sans le savoir. Le comique naît du décalage entre ses ambitions et son ignorance.",

      syn:"Mme Jourdain et Nicole incarnent le bon sens populaire. Leur franc-parler contraste avec les prétentions de M. Jourdain et met en relief son ridicule.",

      or:["Débat","Faut-il chercher à imiter ceux qui nous semblent supérieurs ?"],
      ec:["Texte argumentatif","Mme Jourdain écrit à une amie pour dénoncer la folie de son mari. Rédigez sa lettre."]},

      syn:"Covielle et Cléonte organisent une fausse cérémonie qui fait de M. Jourdain un « Mamamouchi ». La turquerie, mêlant musique, danse et langage inventé, sert la ruse et porte le comique à son comble.",
      lg:"theatre", lo:"Analyser le rôle des didascalies et du spectacle.",

  {q:"Rédigez un conseil poli à un camarade qui révise mal.",a:"Exemple : Tu pourrais faire des fiches et réviser un peu chaque jour plutôt que tout la veille."}]},
discours:{t:"Le discours direct et le discours indirect", lv:["tc","1bac"],
 c:"<p>Le <b>discours direct</b> rapporte les paroles telles quelles, avec des guillemets ou un tiret, après un verbe introducteur.</p><p>Le <b>discours indirect</b> les intègre au récit par une subordonnée : <i>Il dit qu’il viendrait.</i></p><p>Au passage du direct à l’indirect : les pronoms et possessifs changent, les temps se transforment si le verbe introducteur est au passé (présent → imparfait ; futur → conditionnel ; passé composé → plus-que-parfait), les indicateurs changent (aujourd’hui → ce jour-là ; demain → le lendemain).</p>",
 x:[{q:"Passez au discours indirect : Il a dit : « Je pars demain. »",a:"Il a dit qu’il partait le lendemain."},
  {q:"Passez au discours indirect : Elle demanda : « As-tu fini ton travail ? »",a:"Elle demanda s’il avait fini son travail."},
  {q:"« Il affirma qu’il reviendrait. » Quel temps correspond au futur du discours direct ?",t:"qcm",o:["Le conditionnel présent","L’imparfait","Le plus-que-parfait","Le passé simple"],k:0,e:"Futur du direct → conditionnel dans l’indirect au passé."},
  {q:"Passez au discours direct : La mère déclara qu’elle ne vendrait jamais son enfant.",a:"La mère déclara : « Je ne vendrai jamais mon enfant. »"},
  {q:"Quel signe de ponctuation introduit souvent le discours direct ?",t:"qcm",o:["Les deux-points et les guillemets","Le point-virgule","Les parenthèses","Les points de suspension"],k:0,e:"Deux-points puis guillemets ou tiret."}]},
phrases:{t:"Les types et formes de phrases", lv:["tc"],
 c:"<p><b>Quatre types</b> : déclaratif (affirme), interrogatif (questionne), exclamatif (exprime une émotion), impératif ou injonctif (ordonne).</p><p><b>Formes</b> : affirmative / négative ; active / passive ; neutre / emphatique (mise en relief : <i>C’est lui qui…</i>).</p><p>Au théâtre comme dans le récit, le type de phrase révèle l’état d’esprit du personnage : l’exclamation traduit la colère, la surprise ou l’indignation.</p>",
 x:[{q:"« Comme tu as changé ! » Type de phrase ?",t:"qcm",o:["Exclamative","Interrogative","Déclarative","Impérative"],k:0,e:"Elle exprime la surprise."},
  {q:"Mettez à la forme négative : « Il a toujours raison. »",a:"Il n’a jamais raison."},
  {q:"Mettez à la forme passive : « Le jury a récompensé l’élève. »",a:"L’élève a été récompensé par le jury."},
  {q:"« C’est mon père qui m’a appris à lire. » Quelle forme ?",t:"qcm",o:["Emphatique","Passive","Négative","Interrogative"],k:0,e:"« C’est… qui » met en relief."},
  {q:"Transformez en phrase interrogative avec inversion : « Vous venez ce soir. »",a:"Venez-vous ce soir ?"}]},
niveaux:{t:"Les niveaux de langue", lv:["tc","2bac"],
 c:"<ul><li><b>Familier</b> : à l’oral, entre proches ; vocabulaire relâché, syntaxe simplifiée (« J’sais pas », « bosser »).</li><li><b>Courant</b> : usage quotidien, correct et neutre (« Je ne sais pas », « travailler »).</li><li><b>Soutenu</b> : écrits littéraires, situations solennelles ; vocabulaire recherché (« Je l’ignore », « œuvrer »).</li></ul><p>Dans un récit réaliste, reproduire le parler populaire crée un <b>effet de réel</b> et caractérise socialement les personnages.</p>",
 x:[{q:"« Il a bossé toute la journée. » Niveau de langue ?",t:"qcm",o:["Familier","Courant","Soutenu"],k:0,e:"« Bosser » est familier."},
  {q:"Donnez l’équivalent courant et soutenu de « bouquin ».",a:"Courant : livre. Soutenu : ouvrage."},
  {q:"« Je m’en vais quérir mon manteau. » Niveau de langue ?",t:"qcm",o:["Soutenu","Familier","Courant"],k:0,e:"« Quérir » est un verbe soutenu."},
  {q:"Réécrivez en langue courante : « T’as pas vu mon frangin ? »",a:"Tu n’as pas vu mon frère ?"},
  {q:"Pourquoi Maupassant fait-il parler ses paysans dans leur langue ?",a:"Pour créer un effet de réel et caractériser socialement les personnages."}]},
modalisation:{t:"La modalisation : certitude, doute, jugement", lv:["tc","1bac"],
 c:"<p>La <b>modalisation</b> exprime l’attitude du locuteur vis-à-vis de ce qu’il dit.</p><ul><li><b>Certitude</b> : sans doute, assurément, il est certain que, je suis sûr que.</li><li><b>Doute</b> : peut-être, sembler, paraître, il est possible que, le conditionnel.</li><li><b>Jugement</b> : adjectifs et adverbes évaluatifs (heureusement, malheureusement, terrible).</li></ul><p>Dans le récit fantastique, les modalisateurs du doute traduisent l’<b>hésitation</b> du personnage face à l’inexplicable.</p>",
 x:[{q:"« Il semblait qu’une ombre glissait sur le mur. » Quel modalisateur ?",t:"qcm",o:["« Il semblait »","« une ombre »","« glissait »","« sur le mur »"],k:0,e:"« Il semblait » exprime l’incertitude."},
  {q:"« Peut-être avait-il rêvé. » Ce modalisateur exprime…",t:"qcm",o:["le doute","la certitude","l’ordre","la cause"],k:0,e:"« Peut-être » marque l’incertitude."},
  {q:"Transformez pour exprimer la certitude : « Il viendra peut-être. »",a:"Il viendra sans aucun doute. / Je suis sûr qu’il viendra."},
  {q:"« Selon certains témoins, le château serait hanté. » Valeur du conditionnel ?",t:"qcm",o:["Information non vérifiée","Condition","Politesse","Futur dans le passé"],k:0,e:"Conditionnel journalistique : prudence."},
  {q:"Rédigez deux phrases exprimant l’hésitation face à un bruit étrange.",a:"Exemple : Était-ce le vent ou un pas ? Je crus entendre quelqu’un, mais je n’en étais pas sûr."}]},
figures:{t:"Les figures de style", lv:["tc","1bac","2bac"],
 c:"<ul><li><b>Comparaison</b> : rapprochement avec un outil (comme, tel, pareil à) : <i>fort comme un lion</i>.</li><li><b>Métaphore</b> : rapprochement sans outil : <i>ce lion</i> (pour un homme courageux).</li><li><b>Personnification</b> : attribuer des traits humains à une chose.</li><li><b>Antithèse</b> : opposition de deux termes ; <b>oxymore</b> : deux termes opposés unis (<i>boucherie héroïque</i>).</li><li><b>Hyperbole</b> : exagération ; <b>litote</b> : dire moins pour suggérer plus.</li><li><b>Anaphore</b> : répétition d’un mot en début de phrase ou de vers.</li><li><b>Gradation</b> : succession de termes d’intensité croissante.</li></ul>",
 x:[{q:"« Ses yeux brillaient comme des étoiles. »",t:"qcm",o:["Comparaison","Métaphore","Antithèse","Litote"],k:0,e:"Outil de comparaison « comme »."},
  {q:"« Une obscure clarté »",t:"qcm",o:["Oxymore","Hyperbole","Anaphore","Personnification"],k:0,e:"Deux termes contraires unis."},
  {q:"« Je meurs de faim. »",t:"qcm",o:["Hyperbole","Litote","Comparaison","Gradation"],k:0,e:"Exagération."},
  {q:"« Va, je ne te hais point. » (Corneille)",t:"qcm",o:["Litote","Hyperbole","Métaphore","Anaphore"],k:0,e:"Dire moins pour suggérer l’amour."},
  {q:"Transformez la comparaison en métaphore : « Cet homme est rusé comme un renard. »",a:"Cet homme est un renard."}]},
theatre:{t:"Le texte théâtral", lv:["tc","1bac"],
 c:"<ul><li><b>Réplique</b> : ce que dit un personnage ; <b>tirade</b> : longue réplique ; <b>monologue</b> : un personnage seul en scène.</li><li><b>Didascalies</b> : indications de mise en scène (en italique) : gestes, ton, décor.</li><li><b>Aparté</b> : ce qu’un personnage dit sans être entendu des autres.</li><li><b>Stichomythie</b> : échange rapide de courtes répliques.</li><li><b>Double énonciation</b> : les personnages se parlent, mais s’adressent aussi au public.</li><li>Découpage : <b>actes</b> et <b>scènes</b> (une scène change à chaque entrée ou sortie).</li></ul>",
 x:[{q:"« (Il se retourne, furieux.) » Il s’agit…",t:"qcm",o:["d’une didascalie","d’une réplique","d’un aparté","d’une tirade"],k:0,e:"Indication de jeu entre parenthèses."},
  {q:"Comment appelle-t-on une longue réplique ?",t:"qcm",o:["Une tirade","Un aparté","Une didascalie","Une scène"],k:0,e:"La tirade est un long discours."},
  {q:"Qu’est-ce qu’un aparté ?",a:"Une réplique qu’un personnage prononce sans être entendu des autres personnages, mais entendu du public."},
  {q:"Qu’est-ce qui provoque un changement de scène ?",t:"qcm",o:["L’entrée ou la sortie d’un personnage","Un changement de décor uniquement","La fin d’une tirade","Un aparté"],k:0,e:"Convention du théâtre classique."},
  {q:"Expliquez la double énonciation.",a:"Les personnages se parlent entre eux, mais l’auteur s’adresse en même temps au public, qui reçoit toutes les répliques."}]},
enonciation:{t:"L’énonciation : discours et récit", lv:["1bac","2bac"],
 c:"<p>La situation d’énonciation répond à : <b>qui parle ? à qui ? où ? quand ?</b></p><ul><li>Énoncé <b>ancré</b> (discours) : marques du locuteur (je, nous), de l’interlocuteur (tu, vous), indicateurs liés au moment de parole (ici, aujourd’hui, demain), temps du présent, passé composé, futur.</li><li>Énoncé <b>coupé</b> (récit) : troisième personne, indicateurs absolus (ce jour-là, le lendemain), passé simple et imparfait.</li></ul><p>Dans l’autobiographie, on distingue le <b>je narrant</b> (l’adulte qui écrit) et le <b>je narré</b> (l’enfant).</p>",
 x:[{q:"« Demain, je partirai. » L’énoncé est…",t:"qcm",o:["ancré dans la situation d’énonciation","coupé de la situation d’énonciation"],k:0,e:"« Demain », « je », futur."},
  {q:"« Le lendemain, il partit. » L’énoncé est…",t:"qcm",o:["coupé de la situation d’énonciation","ancré dans la situation d’énonciation"],k:0,e:"Indicateur absolu, 3e personne, passé simple."},
  {q:"Relevez les indices d’énonciation : « Je vous écris aujourd’hui pour vous remercier. »",a:"Je (locuteur), vous (destinataire), aujourd’hui (moment), présent « écris »."},
  {q:"Qu’est-ce que le « je narrant » dans une autobiographie ?",a:"L’adulte qui écrit au moment de l’écriture et se souvient de son passé."},
  {q:"Transformez en énoncé coupé : « Hier, j’ai vu ton frère ici. »",a:"La veille, il avait vu son frère à cet endroit."}]},
champ:{t:"Le champ lexical, la dénotation et la connotation", lv:["1bac"],
 c:"<p>Un <b>champ lexical</b> est l’ensemble des mots qui se rapportent à un même thème (la mort : tombe, deuil, funèbre, mourir).</p><p>La <b>dénotation</b> est le sens premier d’un mot ; la <b>connotation</b> est l’ensemble des valeurs et impressions qu’il suggère (le « rouge » dénote une couleur, connote la passion, la violence ou le danger).</p><p>Repérer les champs lexicaux dominants permet de dégager le <b>thème</b> et la <b>tonalité</b> d’un texte.</p>",
 x:[{q:"Quel thème réunit : geôle, cachot, barreaux, verrou ?",t:"qcm",o:["La prison","La maison","La guerre","La nature"],k:0,e:"Champ lexical de l’enfermement."},
  {q:"Constituez un champ lexical de la solitude (5 mots).",a:"Exemple : seul, isolé, abandon, silence, vide."},
  {q:"Quelle connotation a le mot « nuit » dans un récit tragique ?",t:"qcm",o:["La mort, l’angoisse","La fête","La lumière","La joie"],k:0,e:"La nuit suggère souvent la mort ou la peur."},
  {q:"Le mot « hiver » dénote une saison. Que peut-il connoter ?",a:"La vieillesse, la tristesse, la mort, le froid des sentiments."},
  {q:"À quoi sert l’étude des champs lexicaux dans un texte ?",a:"À dégager le thème principal et la tonalité du texte, et à justifier une interprétation."}]},
causecons:{t:"L’expression de la cause et de la conséquence", lv:["1bac"],
 c:"<p><b>Cause</b> (pourquoi ?) : parce que, puisque, comme, étant donné que ; à cause de, grâce à, en raison de ; car, en effet.</p><p><b>Conséquence</b> (résultat) : si bien que, de sorte que, si… que, tellement… que ; donc, ainsi, par conséquent, c’est pourquoi ; au point de.</p><p>« Grâce à » introduit une cause positive, « à cause de » une cause souvent négative.</p>",
 x:[{q:"« Il a échoué ___ il n’a pas révisé. »",t:"qcm",o:["parce qu’","si bien qu’","pourtant","donc"],k:0,e:"Rapport de cause."},
  {q:"« Il était ___ fatigué ___ il s’endormit en classe. »",t:"qcm",o:["si… qu’","parce que… donc","car… ainsi","bien que… mais"],k:0,e:"Conséquence avec intensité."},
  {q:"« Grâce à » ou « à cause de » : « Il a réussi ___ son travail. »",t:"qcm",o:["grâce à","à cause de"],k:0,e:"Cause positive."},
  {q:"Exprimez la cause de deux manières : « Le père est parti. Il était ruiné. »",a:"Le père est parti parce qu’il était ruiné. / Ruiné, le père est parti. / Le père est parti en raison de sa ruine."},
  {q:"Exprimez la conséquence : « La mère pleurait beaucoup. Ses yeux étaient rouges. »",a:"La mère pleurait tellement que ses yeux étaient rouges."}]},
opposition:{t:"L’expression de l’opposition et de la concession", lv:["1bac"],
 c:"<p>L’<b>opposition</b> met en parallèle deux faits contraires : mais, pourtant, cependant, en revanche, alors que, tandis que, au contraire.</p><p>La <b>concession</b> admet un fait mais en écarte la conséquence attendue : bien que + subjonctif, quoique, même si, malgré, certes… mais, avoir beau.</p><p>Dans l’argumentation, la concession permet de reconnaître un argument adverse avant de le dépasser.</p>",
 x:[{q:"« ___ il pleuve, nous sortirons. »",t:"qcm",o:["Bien qu’","Parce qu’","Puisqu’","Comme"],k:0,e:"Concession + subjonctif."},
  {q:"« Antigone refuse, ___ Ismène accepte. »",t:"qcm",o:["tandis qu’","parce qu’","donc","si bien qu’"],k:0,e:"Opposition de deux attitudes."},
  {q:"Reformulez avec « avoir beau » : « Même si Créon insiste, Antigone refuse. »",a:"Créon a beau insister, Antigone refuse."},
  {q:"Reformulez avec « malgré » : « Bien qu’elle ait peur, elle continue. »",a:"Malgré sa peur, elle continue."},
  {q:"Quel mode suit « bien que » ?",t:"qcm",o:["Le subjonctif","L’indicatif","Le conditionnel","L’infinitif"],k:0,e:"Bien que + subjonctif."}]},
argumentation:{t:"L’argumentation : thèse, arguments, exemples", lv:["1bac","2bac"],
 c:"<ul><li><b>Le thème</b> : ce dont on parle. <b>La thèse</b> : l’opinion défendue sur ce thème.</li><li><b>L’argument</b> : idée qui justifie la thèse ; <b>l’exemple</b> : fait concret qui illustre l’argument.</li><li><b>La thèse adverse</b> : l’opinion combattue, souvent réfutée.</li><li><b>Plan</b> d’un texte argumentatif : introduction (amorce, problématique, annonce), développement (paragraphes argumentatifs), conclusion (bilan, ouverture).</li><li>Un paragraphe argumentatif : idée directrice → explication → exemple → mini-conclusion.</li></ul><p>On <b>convainc</b> par la raison, on <b>persuade</b> par les sentiments.</p>",
 x:[{q:"« Le sport est bénéfique, car il améliore la santé ; par exemple, la marche réduit les risques cardiaques. » Quel est l’argument ?",t:"qcm",o:["Il améliore la santé","Le sport est bénéfique","La marche réduit les risques cardiaques"],k:0,e:"La thèse est « le sport est bénéfique », l’exemple concerne la marche."},
  {q:"Convaincre, c’est…",t:"qcm",o:["faire appel à la raison","faire appel aux émotions","raconter une histoire","donner un ordre"],k:0,e:"Persuader fait appel aux émotions."},
  {q:"Trouvez un argument et un exemple pour la thèse : « La lecture forme l’esprit. »",a:"Argument : elle développe l’imagination et l’esprit critique. Exemple : un lecteur de romans apprend à comprendre des points de vue différents du sien."},
  {q:"Quelles sont les trois parties d’une introduction ?",a:"Une amorce (entrée en matière), la problématique (question posée), l’annonce du plan."},
  {q:"Rédigez un paragraphe argumentatif pour la thèse « Il faut préserver les traditions ».",a:"Exemple : Il faut préserver les traditions, car elles transmettent l’identité d’un peuple. En effet, les fêtes et les savoir-faire relient les générations. Ainsi, la fête de l’Achoura rassemble les familles autour de rites partagés. Les abandonner, ce serait donc perdre une part de nous-mêmes."}]},
registres:{t:"Les registres : tragique, pathétique, lyrique, comique", lv:["1bac","2bac"],
 c:"<ul><li><b>Tragique</b> : le héros est écrasé par une fatalité ; on éprouve terreur et pitié.</li><li><b>Pathétique</b> : on suscite la pitié du lecteur par la souffrance (champ lexical de la douleur, exclamations, apostrophes, interrogations).</li><li><b>Lyrique</b> : expression des sentiments personnels (première personne, exclamations, musicalité).</li><li><b>Comique</b> : faire rire (comique de mots, de gestes, de situation, de caractère).</li><li><b>Satirique / ironique</b> : se moquer pour critiquer.</li></ul>",
 x:[{q:"Un personnage sait qu’il va mourir et ne peut échapper à son destin : registre ?",t:"qcm",o:["Tragique","Comique","Lyrique","Satirique"],k:0,e:"La fatalité caractérise le tragique."},
  {q:"Quels procédés caractérisent le pathétique ?",a:"Le champ lexical de la souffrance, les exclamations, les interrogations, les apostrophes, la description de détails émouvants."},
  {q:"« Ô temps ! suspends ton vol ! » Registre ?",t:"qcm",o:["Lyrique","Comique","Satirique","Fantastique"],k:0,e:"Apostrophe et expression des sentiments."},
  {q:"Citez les quatre types de comique.",a:"Le comique de mots, de gestes, de situation et de caractère."},
  {q:"Pourquoi Hugo utilise-t-il le pathétique dans « Le Dernier Jour d’un condamné » ?",a:"Pour émouvoir le lecteur et faire de l’émotion un argument contre la peine de mort."}]},
ironie:{t:"L’ironie et la satire", lv:["2bac"],
 c:"<p>L’<b>ironie</b> consiste à dire le contraire de ce que l’on pense pour le faire comprendre (antiphrase) et se moquer.</p><p>Procédés : <b>antiphrase</b>, <b>exagération</b>, <b>fausse naïveté</b> (le personnage candide rapporte des horreurs sans les juger), <b>juxtaposition</b> de faits contradictoires, <b>oxymore</b>, emploi décalé du vocabulaire mélioratif.</p><p>La <b>satire</b> est une critique moqueuse des mœurs, des institutions ou des personnes.</p>",
 x:[{q:"« Quel beau temps ! » dit-il sous une pluie battante. Procédé ?",t:"qcm",o:["Antiphrase","Hyperbole","Comparaison","Litote"],k:0,e:"Dire le contraire de ce que l’on pense."},
  {q:"« Boucherie héroïque » (Candide, ch. III) est…",t:"qcm",o:["un oxymore","une métaphore filée","une litote","une anaphore"],k:0,e:"Deux termes contradictoires unis."},
  {q:"Qu’est-ce que la fausse naïveté ?",a:"Le narrateur ou le personnage rapporte des faits scandaleux comme s’ils étaient normaux, ce qui en révèle l’absurdité."},
  {q:"Quelle est la cible de la satire dans l’incipit de « Candide » ?",a:"La noblesse vaniteuse et la philosophie optimiste de Pangloss."},
  {q:"Rédigez une phrase ironique sur un élève qui arrive très en retard.",a:"Exemple : « Quelle ponctualité exemplaire ! », dit le professeur à l’élève arrivé avec une heure de retard."}]},
reformulation:{t:"La reformulation et le résumé", lv:["2bac"],
 c:"<p><b>Résumer</b>, c’est réduire un texte en conservant ses idées essentielles et leur enchaînement, sans les déformer.</p><ul><li>Lire et repérer la thèse, les arguments et les connecteurs.</li><li>Supprimer les exemples, répétitions et détails secondaires.</li><li><b>Reformuler</b> : synonymes, <b>nominalisation</b> (« il refuse » → « son refus »), <b>généralisation</b> (« pommes, poires » → « fruits »).</li><li>Respecter le système d’énonciation et le nombre de mots demandé, sans ajouter d’opinion personnelle.</li></ul>",
 x:[{q:"Nominalisez : « Le prix augmente. »",a:"L’augmentation du prix."},
  {q:"Généralisez : « Il aime les romans, les poèmes, les pièces de théâtre. »",a:"Il aime la littérature."},
  {q:"Dans un résumé, peut-on donner son avis ?",t:"qcm",o:["Non","Oui","Seulement en conclusion"],k:0,e:"Le résumé reste fidèle et objectif."},
  {q:"Que doit-on conserver dans un résumé de texte argumentatif ?",t:"qcm",o:["La thèse et les arguments","Les exemples","Les citations","Les détails"],k:0,e:"Les exemples sont en général supprimés."},
  {q:"Reformulez en une phrase : « Le travail éloigne de nous trois grands maux : l’ennui, le vice et le besoin. »",a:"Selon l’auteur, travailler protège de l’ennui, de la corruption et de la pauvreté."}]},
valorisant:{t:"Le lexique valorisant et dévalorisant", lv:["2bac"],
 c:"<p>Le vocabulaire peut être <b>neutre</b> (une maison), <b>valorisant ou mélioratif</b> (une demeure accueillante) ou <b>dévalorisant ou péjoratif</b> (une masure).</p><p>Les suffixes (-âtre, -ard : <i>verdâtre, chauffard</i>), les adjectifs, les comparaisons et les adverbes évaluatifs orientent le jugement du lecteur.</p><p>L’analyse du lexique révèle le <b>point de vue</b> du narrateur ou de l’auteur.</p>",
 x:[{q:"« Une bicoque » est un terme…",t:"qcm",o:["dévalorisant","valorisant","neutre"],k:0,e:"Terme péjoratif pour une maison."},
  {q:"Quel suffixe est péjoratif ?",t:"qcm",o:["-âtre (rougeâtre)","-ette (maisonnette)","-tion (création)","-ment (lentement)"],k:0,e:"-âtre donne une nuance péjorative."},
  {q:"Donnez un équivalent valorisant et un équivalent dévalorisant de « cheval ».",a:"Valorisant : coursier, destrier. Dévalorisant : canasson, haridelle."},
  {q:"Réécrivez de manière dévalorisante : « Une petite maison simple au bord du chemin. »",a:"Exemple : Une masure délabrée échouée au bord d’un chemin boueux."},
  {q:"À quoi sert l’étude du lexique valorisant dans un portrait ?",a:"À dégager le point de vue de l’auteur sur le personnage et le jugement qu’il veut faire partager."}]},
procedes:{t:"Les procédés de l’argumentation", lv:["2bac"],

function hashSeed(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffleQ([q,o,k]){ // ordre stable, propre à chaque question

}

function docForWord(node){
  const c=node.cloneNode(true);
  c.querySelectorAll(".ctl").forEach(x=>x.remove());
  c.querySelectorAll("[contenteditable]").forEach(x=>x.removeAttribute("contenteditable"));
  const ent=c.querySelector(".ent");
  if(ent){const [l,m,r]=[...ent.children];const t=document.createElement("table");t.className="ent";t.innerHTML=`<tr><td style="width:40%">${l.innerHTML}</td><td style="text-align:center;font-weight:bold">${m.innerHTML}</td><td style="text-align:right;direction:rtl;width:40%">${r.innerHTML}</td></tr>`;ent.replaceWith(t)}

}

function buildExam(o){
  const {lvl,mod}=findMod(o.mod),a=analyzeText(o.text),ctx={mod};
  const tq=a?questionsFromText(a,ctx):{qs:[],cor:[]};
  const seqQ=mod.seqs.flatMap(s=>s.q.slice(1,4));
  const pick=(arr,n,seed)=>{const out=[];let h=hashSeed(seed);for(let i=0;i<arr.length&&out.length<n;i++){h=Math.imul(h,1664525)+1013904223>>>0;const x=arr[h%arr.length];if(!out.includes(x))out.push(x)}return out};
  const items=[];
  const C=(q,p,c,cap)=>items.push({q,p,c,cap});
  C(`Recopiez et complétez le tableau suivant : titre de l’œuvre, auteur, genre, date de publication.`,1,`« ${mod.o} » ; ${mod.a} ; ${mod.g.toLowerCase()} ; ${mod.d}.`,"Contextualiser");
  C(o.ref?`Situez le passage (${o.ref}) dans l’œuvre : que s’est-il passé juste avant ?`:`Situez ce passage dans l’œuvre.`,1,"Rappel précis des événements qui précèdent le passage.","Contextualiser");
  const an=[];
  if(a){tq.qs.slice(1,-1).forEach((q,i)=>an.push([q,tq.cor[i+1]]))}
  pick(seqQ,8,o.mod+o.ref).forEach(q=>an.push([q,"Réponse justifiée par des indices précis du texte."]));
  an.push(["« … » (citez une phrase du texte) : identifiez la figure de style employée et précisez son effet.","Identification juste de la figure et explication de son effet de sens."]);
  an.slice(0,6).forEach(([q,c],i)=>C(q,1,c,"Analyser"));
  C(`À la lumière de ce passage, que pensez-vous de l’attitude du personnage principal ? Justifiez votre réponse.`,1,"Point de vue personnel justifié par un argument.","Réagir");
  C(`Quelle valeur ce texte met-il en évidence ? Est-elle encore d’actualité ? Justifiez.`,1,"Identification d’une valeur et argument personnel.","Réagir");
  const pe=mod.pe[hashSeed(o.type+o.sem)%mod.pe.length];
  let parts;
  if(o.model==="cl"){
    items.forEach(it=>{if(it.cap==="Analyser")it.p=1;if(it.cap==="Contextualiser")it.p=.5;if(it.cap==="Réagir")it.p=.5});
    const sc=items.filter(it=>it.cap!=="Analyser"||items.indexOf(it)<7);
    const comp=items.slice(0,8);comp.forEach(it=>it.cap="Compréhension");comp[0].p=1;comp[1].p=1;
    const tot=comp.reduce((x,y)=>x+y.p,0);comp[comp.length-1].p+= +(8-tot).toFixed(2);
    const lg=[{q:"Relevez deux verbes conjugués et donnez leur temps et leur valeur.",p:1,c:"Temps et valeur justes.",cap:"Langue"},{q:"Transformez la phrase soulignée en discours indirect (ou à la forme passive).",p:1,c:"Transformation correcte.",cap:"Langue"},{q:"Relevez un connecteur logique et précisez le rapport qu’il exprime.",p:1,c:"Connecteur et rapport justes.",cap:"Langue"},{q:"Donnez un synonyme et un antonyme d’un mot du texte souligné par l’enseignant.",p:1,c:"Synonyme et antonyme justes.",cap:"Langue"}];
    parts=[{t:"I. Compréhension",n:8,items:comp},{t:"II. Langue",n:4,items:lg}];
    return {lvl,mod,o,a,parts,pe,peN:8,grille:[["Discours : conformité à la consigne",1.5],["Discours : cohérence et progression",1.5],["Discours : organisation",1],["Langue : vocabulaire",1],["Langue : syntaxe et ponctuation",1.5],["Langue : orthographe et conjugaison",1.5]]};
  }
  parts=[{t:"I. Étude de texte",n:10,items}];
  return {lvl,mod,o,a,parts,pe,peN:10,grille:[["Discours : conformité à la consigne",2],["Discours : cohérence de l’argumentation",2],["Discours : structure (organisation et progression)",1],["Langue : vocabulaire",1.5],["Langue : syntaxe et ponctuation",1.5],["Langue : orthographe d’usage et grammaticale, conjugaison",2]]};
}
function checkExam(x){
  const tot=x.parts.reduce((a,p)=>a+p.items.reduce((b,i)=>b+i.p,0),0)+x.peN;const out=[];
  const add=(ok,l,w)=>out.push({ok,label:l,why:w,fix:w});
  add(Math.abs(tot-20)<.01,"Total sur 20 points",`Total calculé : ${tot} points.`);
  add(x.parts.every(p=>p.items.every(i=>i.p>0)),"Barème indiqué pour chaque question","Le barème figure sur le sujet.");
  add(x.grille.length>=4,"Critères de la production écrite affichés","Le cadre de référence demande que critères et barème figurent sur le sujet.");
  add((x.o.text||"").trim().length>40&&x.o.ref,"Texte support présent et référencé",x.o.ref?"Texte et référence fournis.":"Collez le texte et indiquez sa référence.");
  if(x.o.model==="cdr"){const c=k=>x.parts[0].items.filter(i=>i.cap===k).length;add(c("Contextualiser")===2&&c("Analyser")===6&&c("Réagir")===2,"Répartition 2 / 6 / 2 des items",`Contextualiser ${c("Contextualiser")}, analyser ${c("Analyser")}, réagir ${c("Réagir")} (cadre de référence de l’examen régional).`)}
  add(/argument|pensez|point de vue|réflexion/i.test(x.pe),"Production écrite argumentative liée à l’œuvre","Sujet de réflexion en rapport avec un thème de l’œuvre.");
  return out;
}
function renderExam(o){
  if(!o.mod){toast("Choisissez une œuvre.");return}
  const x=buildExam(o);

  let n=0;
  x.parts.forEach(pt=>{doc+=`<h2>${esc(pt.t)} (${pt.n} points)</h2><table><tr><th style="width:6%">N°</th><th>Question</th><th style="width:15%">Capacité</th><th style="width:9%">Barème</th></tr>${pt.items.map(it=>`<tr><td>${++n}</td><td contenteditable="true">${esc(it.q)}</td><td>${esc(it.cap)}</td><td contenteditable="true">${it.p} pt${it.p>1?"s":""}</td></tr>`).join("")}</table>`});
  doc+=`<h2>${x.parts.length>1?"III":"II"}. Production écrite (${x.peN} points)</h2><p contenteditable="true"><b>Sujet :</b> ${esc(x.pe)} Votre texte comportera une introduction, un développement et une conclusion (20 à 25 lignes environ).</p>`;
  doc+=`<table><tr><th>Critères d’évaluation</th><th style="width:14%">Barème</th></tr>${x.grille.map(g=>`<tr><td>${esc(g[0])}</td><td>${g[1]} pt${g[1]>1?"s":""}</td></tr>`).join("")}</table>`;
  let cor=`<div class="corr" style="margin-top:18px"><b>Corrigé indicatif et éléments de réponse</b><ol>${x.parts.flatMap(p=>p.items).map(it=>`<li contenteditable="true">${esc(it.c)}</li>`).join("")}</ol><p class="small">Production écrite : évaluer selon la grille ; valoriser la pertinence des arguments, la cohérence et la correction de la langue.</p></div>`;
  const chk=checkExam(x);
  $("#x-out").innerHTML=`${x.a?`<div style="margin-top:14px">${analysisHTML(x.a)}</div>`:""}<div class="toolbar"><button class="btn pri sm" data-a="word">Exporter en Word</button><button class="btn sm" data-a="print">Imprimer</button><button class="btn sm" data-a="toggle-corr">Masquer le corrigé</button><span class="sp"></span><span class="help">Le sujet est modifiable avant export.</span></div>
   <div class="doclayout"><article class="doc editing" id="doc">${doc}<div id="corrbox">${cor}</div></article><aside class="side-panel"><div class="check">${checkHTML(chk).replace("Conformité pédagogique","Conformité du sujet").replace("Repères : OP 2007, note 142/2007.","Repère : cadre de référence de l’examen régional.")}</div></aside></div>`;
  $("#x-out").scrollIntoView({behavior:"smooth",block:"start"});
}

TOOLS.progression=()=>{
  const lv=store.get("proglv","tc"),start=store.get("progstart","2026-09-07"),end=store.get("progend","2027-06-05");
  const l=lvlById(lv);const vac=CAL.filter(e=>e.k==="vac").map(e=>[dparse(e.d),dparse(e.f)]);
  const weeks=[];for(let d=dparse(start);d<=dparse(end);d=new Date(d.getTime()+7*DAY)){const we=new Date(d.getTime()+5*DAY);const inV=vac.some(([a,b])=>d>=a&&d<=b||we>=a&&we<=b&&(b-a)/DAY>=6&&d>=new Date(a.getTime()-2*DAY));weeks.push({d,v:inV&&vac.some(([a,b])=>d>=new Date(a.getTime()-DAY)&&d<=b)})}
  const work=weeks.filter(w=>!w.v);const mid=dparse("2027-01-24");
  const s1=work.filter(w=>w.d<mid),s2=work.filter(w=>w.d>=mid);
  const plan=[];const place=(mods,ws)=>{const units=[];units.push({t:"Évaluation diagnostique et présentation du programme"});mods.forEach(m=>{m.seqs.forEach((s,i)=>units.push({m,t:`Séq. ${i+1} : ${s.t}`}));units.push({m,t:"Contrôle continu et arrêt-bilan (remédiation)"})});
    ws.forEach((w,i)=>{const u=units[Math.min(units.length-1,Math.floor(i*units.length/ws.length))];plan.push({w,u})})};
  place(l.modules.filter(m=>m.sem==="S1"),s1);place(l.modules.filter(m=>m.sem==="S2"),s2);
  const fmtS=d=>d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});
  app.innerHTML=`<div class="wrap">${crumbs([["Accueil","accueil"],["Progression annuelle"]])}<div class="ph"><div><h1>Progression annuelle</h1><p>Répartition indicative des séquences sur les semaines de cours, vacances exclues. Ajustez selon vos classes et l’horaire de la filière.</p></div><span class="sp"></span><button class="btn sm" data-a="print">Imprimer</button><button class="btn sm pri" data-a="prog-word">Exporter en Word</button></div>
  <div class="card"><div class="f2"><div><label class="l" for="pg-l">Niveau</label><select class="i" id="pg-l">${PROGRAM.map(x=>`<option value="${x.id}" ${x.id===lv?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div><label class="l" for="pg-s">Première semaine de cours</label><input class="i" type="date" id="pg-s" value="${start}"></div><div><label class="l" for="pg-e">Dernière semaine</label><input class="i" type="date" id="pg-e" value="${end}"></div></div></div>
  <div class="tw" style="margin-top:14px" id="progtab"><table class="t"><tr><th>Semaine</th><th>Du</th><th>Module</th><th>Contenu</th></tr>${weeks.map((w,i)=>{const p=plan.find(x=>x.w===w);return w.v?`<tr><td>${i+1}</td><td>${fmtS(w.d)}</td><td colspan="2"><span class="pill och">Vacances</span></td></tr>`:`<tr><td>${i+1}</td><td>${fmtS(w.d)}</td><td>${p&&p.u.m?esc(p.u.m.o):"—"}</td><td>${p?esc(p.u.t):""}</td></tr>`}).join("")}</table></div></div>`;
  $("#pg-l").addEventListener("change",e=>{store.set("proglv",e.target.value);TOOLS.progression()});
  $("#pg-s").addEventListener("change",e=>{store.set("progstart",e.target.value);TOOLS.progression()});
  $("#pg-e").addEventListener("change",e=>{store.set("progend",e.target.value);TOOLS.progression()});
};

  "copy-tahaddi"(){copyText(A.tahaddi.t,"Quiz copié : collez-le dans Tahaddi.")},
  "gen-del"(d){if(!A["gen-del"].armed){A["gen-del"].armed=1;$("[data-a=gen-del]").textContent="Confirmer la suppression";setTimeout(()=>A["gen-del"].armed=0,4000);return}store.del("gen."+d.id);location.hash="#generateur";toast("Fiche supprimée.")},
  "gen-analyse"(){const a=analyzeText($("#g-text").value);$("#g-out").innerHTML=analysisHTML(a)},
  ans(d,el){const ex=el.closest(".ex"),k=+ex.dataset.k;$$("button",ex).forEach(b=>b.classList.remove("ok","ko"));el.classList.add(+d.j===k?"ok":"ko");if(+d.j!==k)$$("button",ex)[k].classList.add("ok");const fb=$(".fb",ex);fb.hidden=false;fb.textContent=(+d.j===k?"Bonne réponse. ":"Réponse attendue : "+$$("button",ex)[k].textContent+". ")+fb.dataset.e0;},
  show(d,el){const fb=$(".fb",el.closest(".ex"));fb.hidden=!fb.hidden;el.textContent=fb.hidden?"Afficher le corrigé":"Masquer le corrigé"},
  "lg-word"(d){const L=LANGUE[d.id];const html=entete(L.t,"Cours de langue et exercices")+`<h2>Rappel de cours</h2>${L.c}<h2>Exercices</h2><ol>${L.x.map(x=>`<li>${esc(x.q)}${x.t==="qcm"?"<br>"+shuffleQ([x.q,x.o,x.k]).o.map((o,j)=>LET[j]+". "+esc(o)).join(" &nbsp; "):""}</li>`).join("")}</ol><h2>Corrigé</h2><ol>${L.x.map(x=>`<li>${esc(x.t==="qcm"?LET[shuffleQ([x.q,x.o,x.k]).k]+". "+x.o[x.k]:x.a)}</li>`).join("")}</ol>`;
    const t=document.createElement("div");t.innerHTML=html;download(slug(L.t)+".doc",wordDoc(L.t,docForWord(t)),"application/msword")},
  "toggle-corr"(d,el){const c=$("#corrbox");c.hidden=!c.hidden;el.textContent=c.hidden?"Afficher le corrigé":"Masquer le corrigé"},
  "edt-add"(){const r=edt();r.push({jour:"Lundi",deb:"08:00",fin:"10:00",classe:"",niv:"tc",salle:""});store.set("edt",r);TOOLS.edt()},
  "edt-del"(d){const r=edt();r.splice(+d.i,1);store.set("edt",r);TOOLS.edt()},
  "cj-word":cjWord,
  "nt-sel"(d){store.set("notesci",+d.i);TOOLS.notes()},
  "nt-addc"(){const all=store.get("notes",{classes:[]});all.classes.push({nom:"Classe "+(all.classes.length+1),cols:[{n:"Contrôle 1",w:1},{n:"Contrôle 2",w:1},{n:"Contrôle 3",w:1},{n:"Activités intégrées",w:1}],eleves:[]});store.set("notes",all);store.set("notesci",all.classes.length-1);TOOLS.notes()},
  "nt-adde"(){const {c,save}=TOOLS.notes.ctx;$("#nt-list").value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,80).forEach(n=>c.eleves.push({nom:n.slice(0,60),n:[]}));save();TOOLS.notes()},
  "nt-dele"(d){const {c,save}=TOOLS.notes.ctx;c.eleves.splice(+d.i,1);save();TOOLS.notes()},
  "nt-addcol"(){const {c,save}=TOOLS.notes.ctx;c.cols.push({n:"Note "+(c.cols.length+1),w:1});save();TOOLS.notes()},
  "nt-delc"(){if(!A["nt-delc"].armed){A["nt-delc"].armed=1;$("[data-a=nt-delc]").textContent="Confirmer la suppression";setTimeout(()=>A["nt-delc"].armed=0,4000);return}A["nt-delc"].armed=0;const {all,ci}=TOOLS.notes.ctx;all.classes.splice(ci,1);store.set("notes",all);store.set("notesci",0);TOOLS.notes()},
  "nt-copy"(){copyText(notesTable("\t"),"Tableau copié : collez-le dans votre tableur.")},
  "nt-csv"(){const {c}=TOOLS.notes.ctx;download(slug(c.nom)+".csv","﻿"+notesTable(";"),"text/csv")},
  "prog-word"(){const t=$("#progtab").cloneNode(true);download("progression-"+store.get("proglv","tc")+".doc",wordDoc("Progression annuelle",entete("Progression annuelle",lvlById(store.get("proglv","tc")).name)+t.innerHTML),"application/msword")},
  "bk-dl"(){download("mihbara-sauvegarde-"+new Date().toISOString().slice(0,10)+".json",backupText(),"application/json")},
  "bk-copy"(){copyText(backupText(),"Sauvegarde copiée.")},
  "bk-imp"(){importBackup($("#bk-in").value)},
  "sh-copy"(){copyText(SITE_URL(),"Adresse copiée.")}
};
function notesTable(sep){const {c,avg,fmt}=TOOLS.notes.ctx;const q=v=>{v=String(v??"");return sep===";"&&/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};return [["N°","Élève",...c.cols.map(x=>x.n),"Moyenne"].map(q).join(sep),...c.eleves.map((s,i)=>[i+1,s.nom,...c.cols.map((_,j)=>String(s.n[j]??"").replace(".",",")),fmt(avg(s))].map(q).join(sep))].join("\n")}
function rerenderDoc(){const d=$("#doc");if(!d||!CUR)return;d.innerHTML=CUR.model.kind==="fiche"?renderFicheDoc(CUR.model):renderProjetDoc(CUR.model);refreshCheck()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener("input",e=>{if(e.target.closest("#doc [data-k]"))onDocInput(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$(".modal");if(m)m.remove()}});
/* boot */
nav();
if(!store.get("seen",false)){store.set("seen",true);if(!profile().prof)setTimeout(()=>toast("Bienvenue ! Complétez votre profil pour personnaliser l’en-tête des fiches."),600)}
</script>
</body>
</html>
