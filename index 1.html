const EXAM_MODELS={
  cce:{l:"Contrôle continu : compréhension de l’écrit et langue (10 + 10)",dur:"1 heure",h:"Note 142-05 : texte de base extrait d’une œuvre au programme, une heure."},
  ccp:{l:"Contrôle continu : production écrite (20)",dur:"1 heure",h:"Note 142-05 : production écrite notée sur 20, une heure."},
  cdr:{l:"Examen régional blanc, 1re année Bac (10 + 10)",dur:"2 heures",h:"Cadre de référence : étude de texte 10 points (contextualiser 2, analyser 6, réagir 2), production écrite 10 points."}
};
const GRILLE_PE20=[["Respect des paramètres de la situation de communication (consigne, destinataire, type de texte)",4],["Application des règles d’écriture et de composition (plan, paragraphes, connecteurs, cohérence)",5],["Correction de l’expression (vocabulaire, syntaxe, orthographe, conjugaison, ponctuation)",6],["Traitement personnel et original du sujet (pertinence des arguments, exemples)",4],["Présentation de la copie (lisibilité, mise en page, propreté)",1]];
function examPick(arr,n,seed){const out=[];let h=hashSeed(seed);for(let i=0;i<arr.length*3&&out.length<n;i++){h=Math.imul(h,1664525)+1013904223>>>0;const x=arr[h%arr.length];if(!out.includes(x))out.push(x)}return out}
function buildExam(o){
  const {lvl,mod}=findMod(o.mod),a=analyzeText(o.text),ctx={mod};
  const tq=a?questionsFromText(a,ctx):{qs:[],cor:[]};
  const seqQ=mod.seqs.flatMap(s=>s.q.slice(1,5));
  const pe=mod.pe[hashSeed(o.type+o.sem+o.model)%mod.pe.length];
  const M=EXAM_MODELS[o.model];
  const I=(q,p,c,cap)=>({q,p,c,cap});
  const ctxItems=[I("Recopiez et complétez le tableau suivant : titre de l’œuvre, auteur, genre, date de publication.",1,`« ${mod.o} » ; ${mod.a} ; ${mod.g.toLowerCase()} ; ${mod.d}.`,"Situer un passage dans l’œuvre"),
    I(o.ref?`Situez le passage (${o.ref}) dans l’œuvre : que s’est-il passé juste avant ?`:"Situez ce passage dans l’œuvre.",1,"Rappel précis des événements qui précèdent le passage.","Situer un passage dans l’œuvre")];
  const anaPool=[];
  if(a)tq.qs.slice(1,-1).forEach((q,i)=>anaPool.push([q,tq.cor[i+1]]));
  if(a)anaPool.push(["Quelle critique ou quelle valeur ce passage met-il en évidence ? Justifiez par le texte.","Critique ou valeur pertinente, justifiée par une citation."]);
  else examPick(seqQ,8,o.mod+o.ref+o.type).forEach(q=>anaPool.push([q,"Réponse justifiée par des indices précis du texte."]));
  if(o.model==="ccp"){
    return {lvl,mod,o,a,M,parts:[],pe,peN:20,grille:GRILLE_PE20};
  }
  if(o.model==="cdr"){
    const items=[...ctxItems.map(x=>Object.assign(x,{cap:"Contextualiser"}))];
    anaPool.slice(0,5).forEach(([q,c])=>items.push(I(q,1,c,"Analyser")));
    items.push(I("« … » (citez une phrase du texte) : identifiez le fait de langue ou de style employé et montrez son rapport avec le sens.",1,"Identification juste et explication de l’effet de sens.","Analyser"));
    items.push(I("À la lumière de ce passage, que pensez-vous de l’attitude du personnage principal ? Justifiez votre réponse.",1,"Point de vue personnel justifié par un argument.","Réagir"));
    items.push(I("Quelle valeur ce texte met-il en évidence ? Est-elle encore d’actualité ? Justifiez.",1,"Identification d’une valeur et argument personnel.","Réagir"));
    return {lvl,mod,o,a,M,parts:[{t:"I. Étude de texte",n:10,items}],pe,peN:10,grille:[["Discours : conformité à la consigne",2],["Discours : cohérence de l’argumentation",2],["Discours : structure (organisation et progression)",1],["Langue : vocabulaire",1.5],["Langue : syntaxe et ponctuation",1.5],["Langue : orthographe d’usage et grammaticale, conjugaison",2]]};
  }
  // cce : compréhension de l’écrit (10) + langue (10)
  const comp=[ctxItems[0],ctxItems[1]];
  for(let i=anaPool.length-1;i>=0;i--)if(/passé simple|imparfait|connecteur/i.test(anaPool[i][0]))anaPool.splice(i,1);
  const capsC=["Dégager l’organisation d’un texte","Comprendre le contenu d’un passage","Comprendre le contenu d’un passage","Établir un rapport entre un fait de langue ou de style et le sens","Dégager des éléments culturels et des valeurs"];
  anaPool.slice(0,5).forEach(([q,c],i)=>comp.push(I(q,i<3?1.5:1,c,capsC[i])));
  comp.push(I("Que pensez-vous de l’attitude du personnage principal dans ce passage ? Justifiez.",1.5,"Point de vue personnel justifié.","Réagir face à un texte"));
  const t=comp.reduce((x,y)=>x+y.p,0);comp[comp.length-1].p=+(comp[comp.length-1].p+10-t).toFixed(2);
  const lang=[];
  if(a){
    const sents=String(o.text).replace(/\s+/g," ").split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>{const w=x.split(" ").length;return w>=6&&w<=22&&!/[«»"“”]/.test(x)&&!/\b(ne|n['’]|rien|jamais|personne|aucun)\b/i.test(x)&&!/\?$/.test(x)});
    const S=sents.length?sents[hashSeed(o.type)%sents.length]:"";
    if(a.dom==="narratif")lang.push(I("Relevez dans le texte deux verbes au passé simple et deux verbes à l’imparfait ; précisez la valeur de chaque temps.",2,`Exemples : ${a.ps.slice(0,2).join(", ")||"…"} (premier plan) ; ${a.imp.slice(0,2).join(", ")||"…"} (arrière-plan, description, habitude).`,"Identifier et employer des faits de langue"));
    else if(a.con.length)lang.push(I(`Quel rapport logique exprime le connecteur « ${a.con[0]} » ? Remplacez-le par un connecteur équivalent.`,2,"Rapport logique juste et connecteur équivalent adapté au contexte.","Identifier et employer des faits de langue"));
    else lang.push(I("Relevez deux expansions du nom dans le texte et précisez leur nature.",2,"Adjectif épithète, complément du nom ou proposition relative correctement identifiés.","Identifier et employer des faits de langue"));
    const NUM=/^(mille|cent|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|vingt|trente|quarante|cinquante|soixante|million|milliers?)$/;const W=a.top.filter(w=>!NUM.test(w)&&w.length>=5);
    if(W.length)lang.push(I(`Donnez un synonyme et un antonyme du mot « ${W[Math.min(1,W.length-1)]} » tel qu’il est employé dans le texte.`,2,"Synonyme et antonyme adaptés au contexte.","Identifier et employer des faits de langue"));
    if(S)lang.push(I(`Réécrivez la phrase suivante à la forme négative puis à la forme interrogative : « ${S} »`,2,"Transformations correctes (place de la négation, inversion ou « est-ce que », ponctuation).","Appliquer des règles"));
    const sq=mod.seqs.find(x=>x.lgT&&!/paratexte|fiche de lecture|schéma narratif|lexique du théâtre/i.test(x.lgT));
    if(sq)lang.push(I(`Relevez dans le texte un exemple illustrant la notion étudiée : ${sq.lgT.charAt(0).toLowerCase()+sq.lgT.slice(1)}. Expliquez son effet.`,2,"Exemple pertinent tiré du texte et effet expliqué.","Appliquer des règles"));
  }else{
    const lgs=[...new Set(mod.seqs.map(s=>s.lg))].filter(k=>LANGUE[k]);
    examPick(lgs.flatMap(k=>LANGUE[k].x.filter(x=>x.t!=="qcm")),4,o.mod+o.type+"lg").forEach(x=>lang.push(I(x.q,2,x.a,"Identifier et employer des faits de langue")));
  }
  lang.push(I("Relevez dans le texte les indices de l’énonciation (qui parle, à qui, où, quand) et dites ce qu’ils révèlent de la situation de communication.",2,"Indices de personne, de lieu et de temps correctement relevés et interprétés.","Rapport entre un énoncé et une situation de communication"));
  while(lang.reduce((x,y)=>x+y.p,0)>10)lang.splice(lang.length-2,1);
  const tl=lang.reduce((x,y)=>x+y.p,0);if(tl<10)lang[0].p+=10-tl;
  return {lvl,mod,o,a,M,parts:[{t:"I. Compréhension de l’écrit",n:10,items:comp},{t:"II. Langue",n:10,items:lang}],pe:null,peN:0,grille:[]};
}
function checkExam(x){
  const tot=x.parts.reduce((a,p)=>a+p.items.reduce((b,i)=>b+i.p,0),0)+x.peN;const out=[];
  const add=(ok,l,w)=>out.push({ok,label:l,why:w,fix:w});
  add(Math.abs(tot-20)<.01,"Total sur 20 points",`Total calculé : ${+tot.toFixed(2)} points.`);
  add(x.parts.every(p=>p.items.every(i=>i.p>0)),"Barème indiqué pour chaque question","La note 142-05 demande un sujet préparé avec éléments de réponse et barème.");
  if(x.o.model==="cce"){
    add(Math.abs(x.parts[0].items.reduce((a,i)=>a+i.p,0)-10)<.01&&Math.abs(x.parts[1].items.reduce((a,i)=>a+i.p,0)-10)<.01,"Répartition 10 + 10","Compréhension de l’écrit sur 10 et langue sur 10 (note 142-05).");
    add((x.o.text||"").trim().length>40&&x.o.ref,"Texte de base extrait de l’œuvre et référencé",x.o.ref?"Texte et référence fournis.":"Collez l’extrait et indiquez sa référence.");
    add(true,"Durée d’une heure","Note 142-05 : une heure par contrôle.");
  }
  if(x.o.model==="ccp"){add(x.grille.length>=5,"Capacités de la production écrite évaluées","Situation de communication, règles d’écriture, correction, traitement personnel, présentation (annexe de la note 142-05).");add(true,"Durée d’une heure","Note 142-05 : une heure par contrôle.")}
  if(x.o.model==="cdr"){const c=k=>x.parts[0].items.filter(i=>i.cap===k).length;
    add(c("Contextualiser")===2&&c("Analyser")===6&&c("Réagir")===2,"Répartition 2 / 6 / 2 des items",`Contextualiser ${c("Contextualiser")}, analyser ${c("Analyser")}, réagir ${c("Réagir")}.`);
    add(x.grille.length>=4,"Critères de la production écrite affichés","Le cadre de référence demande que critères et barème figurent sur le sujet.");
    add((x.o.text||"").trim().length>40&&x.o.ref,"Texte support présent et référencé",x.o.ref?"Texte et référence fournis.":"Collez le texte et indiquez sa référence.")}
  if(x.pe)add(/argument|pensez|point de vue|réflexion|racontez|approuvez|montrez/i.test(x.pe),"Sujet de production lié aux thèmes de l’œuvre","Production écrite en rapport avec une œuvre au programme.");
  add(true,"Rapport de correction prévu","La note 142-05 demande une correction collective et un rapport indiquant les difficultés et le soutien proposé.");
  return out;
}
function renderExam(o){
  if(!o.mod){toast("Choisissez une œuvre.");return}
  const x=buildExam(o);
  let doc=entete(`${o.type} — Français`,`${x.lvl.name} · Semestre ${o.sem} · Durée : ${x.M.dur}`);
  doc+=`<table><tr><td class="lab">Nom et prénom</td><td></td><td class="lab" style="width:14%">Classe</td><td style="width:14%"></td><td class="lab" style="width:10%">Note</td><td style="width:10%">/20</td></tr></table>`;
  if(o.model!=="ccp"||o.text.trim())doc+=`<h2>Texte</h2><div contenteditable="true">${o.text.trim()?esc(o.text.trim()).replace(/\n/g,"<br>"):"<i>Collez le texte support.</i>"}</div><p class="small" style="text-align:right">${esc(x.mod.a)}, « ${esc(x.mod.o)} »${o.ref?", "+esc(o.ref):""}</p>`;
  let n=0;
  x.parts.forEach(pt=>{doc+=`<h2>${esc(pt.t)} (${pt.n} points)</h2><table><tr><th style="width:6%">N°</th><th>Question</th><th style="width:20%">Capacité visée</th><th style="width:9%">Barème</th></tr>${pt.items.map(it=>`<tr><td>${++n}</td><td contenteditable="true">${esc(it.q)}</td><td class="small">${esc(it.cap)}</td><td contenteditable="true">${it.p} pt${it.p>1?"s":""}</td></tr>`).join("")}</table>`});
  if(x.pe){doc+=`<h2>${x.parts.length?(x.parts.length>1?"III":"II")+". ":""}Production écrite (${x.peN} points)</h2><p contenteditable="true"><b>Sujet :</b> ${esc(x.pe)} Votre texte comportera une introduction, un développement et une conclusion (20 à 25 lignes environ).</p>`;
    doc+=`<table><tr><th>Critères d’évaluation</th><th style="width:14%">Barème</th></tr>${x.grille.map(g=>`<tr><td>${esc(g[0])}</td><td>${g[1]} pt${g[1]>1?"s":""}</td></tr>`).join("")}</table>`}
  const items=x.parts.flatMap(p=>p.items);
  const cor=`<div class="corr" style="margin-top:18px"><b>Éléments de réponse et barème</b>${items.length?`<ol>${items.map(it=>`<li contenteditable="true">${esc(it.c)} <i>(${it.p} pt${it.p>1?"s":""})</i></li>`).join("")}</ol>`:""}${x.pe?`<p class="small">Production écrite : évaluer selon la grille ; valoriser la pertinence des arguments, la cohérence et la correction de la langue.</p>`:""}
   <p style="margin-top:10px"><b>Rapport de correction</b> (à compléter après la correction collective)</p><table><tr><td class="lab">Difficultés relevées</td><td contenteditable="true"></td></tr><tr><td class="lab">Soutien et remédiation proposés</td><td contenteditable="true"></td></tr><tr><td class="lab">Date du contrôle / de la correction</td><td contenteditable="true"></td></tr></table><p class="small">Note 142-05 : consigner le sujet, les éléments de réponse, le barème et les dates dans le cahier de textes.</p></div>`;
  const chk=checkExam(x);
  $("#x-out").innerHTML=`${x.a?`<div style="margin-top:14px">${analysisHTML(x.a)}</div>`:""}<div class="toolbar"><button class="btn pri sm" data-a="word">Exporter en Word</button><button class="btn sm" data-a="print">Imprimer</button><button class="btn sm" data-a="toggle-corr">Masquer le corrigé</button><span class="sp"></span><span class="help">Le sujet est modifiable avant export.</span></div>
   <div class="doclayout"><article class="doc editing" id="doc">${doc}<div id="corrbox">${cor}</div></article><aside class="side-panel"><div class="check">${checkHTML(chk).replace("Conformité pédagogique","Conformité du sujet").replace("Repères : OP 2007, note 142/2007.",o.model==="cdr"?"Repère : cadre de référence de l’examen régional.":"Repère : note 142-05 du 16 novembre 2007.")}</div></aside></div>`;
  $("#x-out").scrollIntoView({behavior:"smooth",block:"start"});
}

TOOLS.progression=()=>{
  const lv=store.get("proglv","tc"),start=store.get("progstart","2026-09-07"),end=store.get("progend","2027-06-05");
  const l=lvlById(lv);const vac=CAL.filter(e=>e.k==="vac").map(e=>[dparse(e.d),dparse(e.f)]);
  const weeks=[];for(let d=dparse(start);d<=dparse(end);d=new Date(d.getTime()+7*DAY)){const we=new Date(d.getTime()+5*DAY);const inV=vac.some(([a,b])=>d>=a&&d<=b||we>=a&&we<=b&&(b-a)/DAY>=6&&d>=new Date(a.getTime()-2*DAY));weeks.push({d,v:inV&&vac.some(([a,b])=>d>=new Date(a.getTime()-DAY)&&d<=b)})}
  const work=weeks.filter(w=>!w.v);const mid=dparse("2027-01-24");
  const s1=work.filter(w=>w.d<mid),s2=work.filter(w=>w.d>=mid);
  const plan=[];const place=(mods,ws)=>{const units=[];units.push({t:"Évaluation diagnostique et présentation du programme"});mods.forEach(m=>{m.seqs.forEach((s,i)=>units.push({m,t:`Séq. ${i+1} : ${s.t}`}));units.push({m,t:"Contrôle continu et arrêt-bilan (remédiation)"})});
    ws.forEach((w,i)=>{const u=units[Math.min(units.length-1,Math.floor(i*units.length/ws.length))];plan.push({w,u})})};
  place(l.modules.filter(m=>m.sem==="S1"),s1);place(l.modules.filter(m=>m.sem==="S2"),s2);
  const fmtS=d=>d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});
  app.innerHTML=`<div class="wrap">${crumbs([["Accueil","accueil"],["Progression annuelle"]])}<div class="ph"><div><h1>Progression annuelle</h1><p>Répartition indicative des séquences sur les semaines de cours, vacances exclues. Ajustez selon vos classes et l’horaire de la filière.</p></div><span class="sp"></span><button class="btn sm" data-a="print">Imprimer</button><button class="btn sm pri" data-a="prog-word">Exporter en Word</button></div>
  <div class="card"><div class="f2"><div><label class="l" for="pg-l">Niveau</label><select class="i" id="pg-l">${PROGRAM.map(x=>`<option value="${x.id}" ${x.id===lv?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div><label class="l" for="pg-s">Première semaine de cours</label><input class="i" type="date" id="pg-s" value="${start}"></div><div><label class="l" for="pg-e">Dernière semaine</label><input class="i" type="date" id="pg-e" value="${end}"></div></div></div>
  <div class="tw" style="margin-top:14px" id="progtab"><table class="t"><tr><th>Semaine</th><th>Du</th><th>Module</th><th>Contenu</th></tr>${weeks.map((w,i)=>{const p=plan.find(x=>x.w===w);return w.v?`<tr><td>${i+1}</td><td>${fmtS(w.d)}</td><td colspan="2"><span class="pill och">Vacances</span></td></tr>`:`<tr><td>${i+1}</td><td>${fmtS(w.d)}</td><td>${p&&p.u.m?esc(p.u.m.o):"—"}</td><td>${p?esc(p.u.t):""}</td></tr>`}).join("")}</table></div></div>`;
  $("#pg-l").addEventListener("change",e=>{store.set("proglv",e.target.value);TOOLS.progression()});
  $("#pg-s").addEventListener("change",e=>{store.set("progstart",e.target.value);TOOLS.progression()});
  $("#pg-e").addEventListener("change",e=>{store.set("progend",e.target.value);TOOLS.progression()});
};

  app.innerHTML=`<div class="wrap">${crumbs([["Accueil","accueil"],["Repères officiels"]])}<div class="ph"><div><h1>Repères officiels</h1><p>Les textes de référence appliqués par la plateforme, résumés d’après les documents officiels. Vérifiez toujours les dispositions en vigueur auprès de votre inspection.</p></div></div>
  <div class="grid g2">
   ${card("Orientations pédagogiques et programmes de français (2007)","Cycle secondaire qualifiant","Le projet pédagogique est constitué de modules ; chaque module, organisé en séquences et en activités, s’articule autour d’une œuvre littéraire intégrale.",["Approche par compétences et pédagogie du projet.","Lecture méthodique et analytique d’œuvres intégrales.","Langue intégrée, au service de la lecture et de la production.","Oral, travaux encadrés et production écrite en lien avec l’œuvre.","Tronc commun : mise à niveau, nouvelle réaliste, nouvelle fantastique, comédie."],"structure module, séquence et activités ; démarche de chaque fiche ; contrôle de conformité.")}
   ${card("Note 142","16 novembre 2007","Évaluation pédagogique au cycle secondaire qualifiant : contrôle continu, examen régional et examen national.",["Fonction formative du contrôle continu, au-delà de la sanction.","Suivi des travaux des élèves et mesures correctives.","Calendrier des contrôles, copies corrigées rendues aux élèves.","Sujets, barèmes et dates consignés dans le cahier de textes.","Contrôle continu : 25 % de la moyenne du baccalauréat en 2e année ; moyenne annuelle = moyenne des deux semestres."],"évaluation formative dans chaque fiche, contrôles en fin de module, rapport de correction.")}
   ${card("Note 142-05","16 novembre 2007","Évaluation pédagogique en langue française au cycle secondaire qualifiant.",["Contrôles écrits surveillés : compréhension de l’écrit et langue (10 + 10) ou production écrite (20), une heure chacun.","Texte de base : extrait d’une œuvre au programme.","Sujet préparé à l’avance avec les habiletés évaluées, les éléments de réponse et le barème.","Séance de correction collective et rapport de correction (difficultés, soutien).","Moyenne du contrôle continu : 80 % contrôles écrits, 20 % autres modes (oral, participation, travaux).","Examen régional de 1re année sur tout le programme, selon le cadre de référence."],"générateur de contrôles (deux types d’une heure), rapport de correction, cahier de notes 80 % / 20 %.")}
   ${card("Note 57","2007","Œuvres de français de la 2e année du baccalauréat à partir de 2007-2008.",["Premier semestre : module 1, « Candide » de Voltaire ; module 2, « Il était une fois un vieux couple heureux » de Mohammed Khaïr-Eddine.","Deuxième semestre : module 3, « Le Père Goriot » de Balzac.","Ces œuvres constituent le seul programme officiel ; les ouvrages parallèles sont interdits dans les établissements."],"programme de la 2e année du baccalauréat.")}
   ${card("Note 132","2009","Renforcement de la maîtrise des langues (programme d’urgence).",["Centrer l’enseignement sur les compétences de base en lecture, écriture et oral.","Utiliser la langue d’enseignement de la discipline en classe.","Accorder une place importante à l’évaluation formative et au soutien.","Encourager la lecture autonome, les exposés, le théâtre et les concours.","Instaurer la « mallette pédagogique » : dossier où l’élève range ses travaux et suit ses progrès."],"différenciation et remédiation dans chaque fiche ; activités orales, exposés et dramatisations.")}
   ${card("Cadre de référence de l’examen régional","1re année du baccalauréat","Épreuve de deux heures notée sur 20.",["Étude de texte sur 10 points : contextualiser (2 items), analyser (6), réagir (2).","Production écrite argumentative sur 10 points : discours 5, langue 5.","Critères et barème figurent sur le sujet."],"modèle « examen régional blanc » du générateur.")}
  </div>
  <p class="help" style="margin-top:14px">Résumés établis à partir des textes officiels ; la plateforme ne reproduit pas leur contenu intégral.</p></div>`;
};
/* ============ modales ============ */
function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))m.remove()});document.body.appendChild(m);const f=m.querySelector("input,textarea,button");if(f)f.focus();return m}
function profilModal(){
  const p=profile();
  const m=modal(`<h2>Mon profil</h2><p class="help" style="margin:0">Ces informations apparaissent dans l’en-tête des fiches et des contrôles. Elles restent dans ce navigateur.</p>
  <form class="form" id="pf">${PROFILE_FIELDS.map(([k,l,ph])=>`<div><label class="l" for="pf-${k}">${l}</label><input class="i" id="pf-${k}" value="${esc(p[k]||"")}" placeholder="${esc(ph)}"></div>`).join("")}
  <div class="row"><button class="btn pri" type="submit">Enregistrer</button><button class="btn" type="button" data-close>Fermer</button></div></form>
  <hr style="border:0;border-top:1px solid var(--line);width:100%"><h2 style="font-size:18px">Sauvegarde</h2><p class="help" style="margin:0">Transférez vos fiches modifiées, votre emploi du temps et vos notes vers un autre appareil.</p>
  <div class="row"><button class="btn sm" data-a="bk-dl">Télécharger la sauvegarde</button><button class="btn sm" data-a="bk-copy">Copier la sauvegarde</button></div>
  <label class="l" for="bk-in">Importer une sauvegarde (coller le texte)</label><textarea class="i" id="bk-in" style="min-height:70px"></textarea><div class="row"><button class="btn sm" data-a="bk-imp">Importer</button><label class="btn sm" for="bk-file" style="cursor:pointer">Importer un fichier</label><input type="file" id="bk-file" accept=".json,application/json" hidden></div>`);
  $("#pf",m).addEventListener("submit",e=>{e.preventDefault();const o={};PROFILE_FIELDS.forEach(([k])=>o[k]=$("#pf-"+k,m).value.trim());store.set("profile",o);m.remove();toast("Profil enregistré.");nav()});
  $("#bk-file",m).addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#bk-in",m).value=r.result;importBackup(r.result)};r.readAsText(f)});
}
function backupText(){const o={app:"mihbara",v:VERSION,at:new Date().toISOString(),data:{}};store.keys().forEach(k=>o.data[k]=store.get(k,null));return JSON.stringify(o)}
function importBackup(t){let o;try{o=JSON.parse(t)}catch(e){toast("Sauvegarde illisible : collez le texte complet.");return}if(!o||o.app!=="mihbara"||typeof o.data!=="object"){toast("Ce texte n’est pas une sauvegarde de la plateforme.");return}
  let n=0;for(const [k,v] of Object.entries(o.data)){if(/^[\w.\-]{1,120}$/.test(k)){store.set(k,v);n++}}toast(n+" éléments importés.");$(".modal")?.remove();nav()}
function shareModal(){
  const u=SITE_URL();
  const m=modal(`<h2>Partager la plateforme</h2><p class="help" style="margin:0">Vos collègues ouvrent la même adresse : chacun garde ses propres fiches dans son navigateur.</p><div class="qr" id="qrbox" role="img" aria-label="Code QR de l’adresse de la plateforme"></div><input class="i" value="${esc(u)}" readonly id="sh-u"><div class="row"><button class="btn pri" data-a="sh-copy">Copier l’adresse</button><button class="btn" data-close>Fermer</button></div>`);
  const draw=()=>{if(window.QRCode){new QRCode($("#qrbox",m),{text:u,width:200,height:200,colorDark:"#16203a",colorLight:"#ffffff"})}else $("#qrbox",m).innerHTML=`<p class="help">Code QR indisponible hors connexion.</p>`};
  if(window.QRCode)draw();else{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=draw;s.onerror=draw;document.head.appendChild(s)}
}

/* ============ actions ============ */
const A={
  profil:profilModal, share:shareModal,
  menu(){$(".side").classList.toggle("open")},
  print(){try{window.print()}catch(e){toast("Impression indisponible ici.")}},
  word(){const d=$("#doc");if(!d)return;const id=CUR?Object.fromEntries(CUR.model.ident||[]):{};const name=CUR?slug((id["Séquence"]||CUR.model.title)+"-"+(CUR.model.act||"projet")):"controle-"+slug(($("#x-mod")||{}).value||"");download((name||"document")+".doc",wordDoc(CUR?CUR.model.title:"Contrôle",docForWord(d)),"application/msword")},
  reset(){if(!CUR)return;if(!A.reset.armed){A.reset.armed=1;const b=$("[data-a=reset]");b.textContent="Confirmer : effacer mes modifications";setTimeout(()=>{A.reset.armed=0;if(b.isConnected)b.textContent="Rétablir l’original"},4000);return}A.reset.armed=0;store.del(CUR.key);toast("Fiche d’origine rétablie.");nav()},
  "add-obj"(){CUR.model.obj=CUR.model.obj||[];CUR.model.obj.push("Identifier …");saveCur();rerenderDoc()},
  "del-obj"(d){CUR.model.obj.splice(+d.i,1);saveCur();rerenderDoc()},
  "add-step"(){CUR.model.steps.push({e:"Nouvelle étape",d:0,p:"",el:"",m:""});saveCur();rerenderDoc()},
  "del-step"(d){CUR.model.steps.splice(+d.i,1);saveCur();rerenderDoc()},
  tahaddi(){if(!CUR)return;const t=tahaddiPayload(CUR.model);modal(`<h2>Quiz pour Tahaddi</h2><p class="help" style="margin:0">Copiez ce texte, ouvrez Tahaddi, cliquez sur « Sauvegarde et import », collez-le puis « Importer le texte collé ». Le quiz apparaît dans votre bibliothèque, prêt à être lancé.</p><textarea class="i" readonly style="min-height:120px">${esc(t)}</textarea><div class="row"><button class="btn pri" data-a="copy-tahaddi">Copier</button><a class="btn" href="${TAHADDI_URL}" target="_blank" rel="noopener">Ouvrir Tahaddi</a><button class="btn" data-close>Fermer</button></div>`);A.tahaddi.t=t},
  "copy-tahaddi"(){copyText(A.tahaddi.t,"Quiz copié : collez-le dans Tahaddi.")},
  "gen-del"(d){if(!A["gen-del"].armed){A["gen-del"].armed=1;$("[data-a=gen-del]").textContent="Confirmer la suppression";setTimeout(()=>A["gen-del"].armed=0,4000);return}store.del("gen."+d.id);location.hash="#generateur";toast("Fiche supprimée.")},
  "gen-analyse"(){const a=analyzeText($("#g-text").value);$("#g-out").innerHTML=analysisHTML(a)},
  ans(d,el){const ex=el.closest(".ex"),k=+ex.dataset.k;$$("button",ex).forEach(b=>b.classList.remove("ok","ko"));el.classList.add(+d.j===k?"ok":"ko");if(+d.j!==k)$$("button",ex)[k].classList.add("ok");const fb=$(".fb",ex);fb.hidden=false;fb.textContent=(+d.j===k?"Bonne réponse. ":"Réponse attendue : "+$$("button",ex)[k].textContent+". ")+fb.dataset.e0;},
  show(d,el){const fb=$(".fb",el.closest(".ex"));fb.hidden=!fb.hidden;el.textContent=fb.hidden?"Afficher le corrigé":"Masquer le corrigé"},
  "lg-word"(d){const L=LANGUE[d.id];const html=entete(L.t,"Cours de langue et exercices")+`<h2>Rappel de cours</h2>${L.c}<h2>Exercices</h2><ol>${L.x.map(x=>`<li>${esc(x.q)}${x.t==="qcm"?"<br>"+shuffleQ([x.q,x.o,x.k]).o.map((o,j)=>LET[j]+". "+esc(o)).join(" &nbsp; "):""}</li>`).join("")}</ol><h2>Corrigé</h2><ol>${L.x.map(x=>`<li>${esc(x.t==="qcm"?LET[shuffleQ([x.q,x.o,x.k]).k]+". "+x.o[x.k]:x.a)}</li>`).join("")}</ol>`;
    const t=document.createElement("div");t.innerHTML=html;download(slug(L.t)+".doc",wordDoc(L.t,docForWord(t)),"application/msword")},
  "toggle-corr"(d,el){const c=$("#corrbox");c.hidden=!c.hidden;el.textContent=c.hidden?"Afficher le corrigé":"Masquer le corrigé"},
  "edt-add"(){const r=edt();r.push({jour:"Lundi",deb:"08:00",fin:"10:00",classe:"",niv:"tc",salle:""});store.set("edt",r);TOOLS.edt()},
  "edt-del"(d){const r=edt();r.splice(+d.i,1);store.set("edt",r);TOOLS.edt()},
  "cj-word":cjWord,
  "nt-sel"(d){store.set("notesci",+d.i);TOOLS.notes()},
  "nt-addc"(){const all=store.get("notes",{classes:[]});all.classes.push({nom:"Classe "+(all.classes.length+1),cols:[{n:"Contrôle 1",w:1,t:"ecrit"},{n:"Contrôle 2",w:1,t:"ecrit"},{n:"Contrôle 3",w:1,t:"ecrit"},{n:"Contrôle 4",w:1,t:"ecrit"},{n:"Activités orales et travaux",w:1,t:"autre"}],eleves:[]});store.set("notes",all);store.set("notesci",all.classes.length-1);TOOLS.notes()},
  "nt-adde"(){const {c,save}=TOOLS.notes.ctx;$("#nt-list").value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,80).forEach(n=>c.eleves.push({nom:n.slice(0,60),n:[]}));save();TOOLS.notes()},
  "nt-dele"(d){const {c,save}=TOOLS.notes.ctx;c.eleves.splice(+d.i,1);save();TOOLS.notes()},
  "nt-addcol"(){const {c,save}=TOOLS.notes.ctx;c.cols.push({n:"Note "+(c.cols.length+1),w:1,t:"ecrit"});save();TOOLS.notes()},
  "nt-delc"(){if(!A["nt-delc"].armed){A["nt-delc"].armed=1;$("[data-a=nt-delc]").textContent="Confirmer la suppression";setTimeout(()=>A["nt-delc"].armed=0,4000);return}A["nt-delc"].armed=0;const {all,ci}=TOOLS.notes.ctx;all.classes.splice(ci,1);store.set("notes",all);store.set("notesci",0);TOOLS.notes()},
  "nt-copy"(){copyText(notesTable("\t"),"Tableau copié : collez-le dans votre tableur.")},
  "nt-csv"(){const {c}=TOOLS.notes.ctx;download(slug(c.nom)+".csv","﻿"+notesTable(";"),"text/csv")},
  "prog-word"(){const t=$("#progtab").cloneNode(true);download("progression-"+store.get("proglv","tc")+".doc",wordDoc("Progression annuelle",entete("Progression annuelle",lvlById(store.get("proglv","tc")).name)+t.innerHTML),"application/msword")},
  "bk-dl"(){download("mihbara-sauvegarde-"+new Date().toISOString().slice(0,10)+".json",backupText(),"application/json")},
  "bk-copy"(){copyText(backupText(),"Sauvegarde copiée.")},
  "bk-imp"(){importBackup($("#bk-in").value)},
  "sh-copy"(){copyText(SITE_URL(),"Adresse copiée.")}
};
function notesTable(sep){const {c,avg,fmt}=TOOLS.notes.ctx;const q=v=>{v=String(v??"");return sep===";"&&/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};return [["N°","Élève",...c.cols.map(x=>x.n),"Moyenne"].map(q).join(sep),...c.eleves.map((s,i)=>[i+1,s.nom,...c.cols.map((_,j)=>String(s.n[j]??"").replace(".",",")),fmt(avg(s))].map(q).join(sep))].join("\n")}
function rerenderDoc(){const d=$("#doc");if(!d||!CUR)return;d.innerHTML=CUR.model.kind==="fiche"?renderFicheDoc(CUR.model):renderProjetDoc(CUR.model);refreshCheck()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener("input",e=>{if(e.target.closest("#doc [data-k]"))onDocInput(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$(".modal");if(m)m.remove()}});
/* boot */
nav();
if(!store.get("seen",false)){store.set("seen",true);if(!profile().prof)setTimeout(()=>toast("Bienvenue ! Complétez votre profil pour personnaliser l’en-tête des fiches."),600)}
</script>
</body>
</html>
