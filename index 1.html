<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mihbara · Espace pédagogique de français</title>
<meta name="description" content="Fiches pédagogiques, cours de langue, contrôles et outils pour le français au lycée qualifiant marocain, conformes aux orientations pédagogiques de 2007.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>/* Plan : l’encre et le cahier. Bleu encre profond pour la structure, bleu Majorelle pour l’action,
   ocre pour les repères. Barre latérale de navigation, documents imprimables au centre. */
:root{
  --paper:#f3f4f8; --surface:#ffffff; --sunk:#eceef4; --ink:#16203a; --muted:#5a6580; --line:#d9dde8;
  --accent:#2d45c4; --accent-soft:#e6e9fb; --on-accent:#ffffff; --ochre:#b9790b; --ochre-soft:#fbf1dc;
  --good:#1d7a52; --good-soft:#e2f3ea; --warn:#a86300; --warn-soft:#fdf0dc; --bad:#b23a2c; --bad-soft:#fbe6e3;
  --side:#16203a; --side-ink:#d8ddef; --side-muted:#8e98b6; --side-hover:#22305a;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --surface:#171e33; --sunk:#121829; --ink:#e6e9f4; --muted:#9aa4c0; --line:#2b3553;
  --accent:#7d8ff0; --accent-soft:#232c55; --on-accent:#0f1424; --ochre:#e3a63a; --ochre-soft:#3a2c12;
  --good:#4cc08b; --good-soft:#15342a; --warn:#e7a54a; --warn-soft:#3a2a12; --bad:#ec7a6a; --bad-soft:#3d1c19;
  --side:#0b1020; --side-ink:#d8ddef; --side-muted:#7e88a6; --side-hover:#1b2442; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1424; --surface:#171e33; --sunk:#121829; --ink:#e6e9f4; --muted:#9aa4c0; --line:#2b3553;
  --accent:#7d8ff0; --accent-soft:#232c55; --on-accent:#0f1424; --ochre:#e3a63a; --ochre-soft:#3a2c12;
  --good:#4cc08b; --good-soft:#15342a; --warn:#e7a54a; --warn-soft:#3a2a12; --bad:#ec7a6a; --bad-soft:#3d1c19;
  --side:#0b1020; --side-ink:#d8ddef; --side-muted:#7e88a6; --side-hover:#1b2442; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.55 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
/* barre latérale */
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 16px;text-decoration:none;color:inherit}
.brand b{font:600 26px/1 var(--f-display);letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--ochre)}
.brand span{font-size:12.5px;color:var(--side-muted)}
.nav-t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--side-hover)}
.nav a.on{background:var(--accent);color:#fff}
.nav a .lv{font:600 11px/1 var(--f-body);border:1px solid currentColor;border-radius:5px;padding:3px 5px;min-width:44px;text-align:center;opacity:.85}
.side-foot{margin-top:18px;padding:10px;border-top:1px solid var(--side-hover);display:grid;gap:8px}
.side-foot button{background:transparent;border:1px solid var(--side-hover);color:var(--side-ink);border-radius:8px;padding:7px 10px;text-align:left;font-size:14px}
.side-foot button:hover{background:var(--side-hover)}
.topbar{display:none}
main{min-width:0;padding:26px 30px 70px}
.wrap{max-width:1120px;margin:0 auto}
/* composants */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(28px,4vw,40px)}
.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--muted)}
.lvcard{border-top:5px solid var(--accent);display:flex;flex-direction:column;gap:10px}
.lvcard .works{display:flex;flex-direction:column;gap:4px;font-size:15px}
.lvcard .works span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--ochre);margin-right:8px;vertical-align:middle}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.och{background:var(--ochre-soft);color:var(--ochre)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-left:6px solid var(--ochre)}
.kpi .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:600 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin:4px 0}
.kpi .s{font-size:14px;color:var(--muted)}
.hero{background:var(--side);color:#eef1fb;border-radius:18px;padding:28px 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:22px}
.hero h1{font-size:clamp(28px,4vw,42px);color:#fff}
.hero p{color:#c4cbe3;max-width:56ch;margin:10px 0 16px}
.hero ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;color:#d6dbef}
.hero ul li{padding-left:22px;position:relative}
.hero ul li::before{content:"✓";position:absolute;left:0;color:var(--ochre)}
.sec{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{font-size:24px}
.sec .note{color:var(--muted);font-size:14px}
table.t{width:100%;border-collapse:collapse;background:var(--surface);font-size:15px}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--sunk);font-weight:700}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tw table.t{border:0}
label.l{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
textarea.i{min-height:120px;resize:vertical}
.form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.help{font-size:13.5px;color:var(--muted);margin-top:4px}
.seqs{display:grid;gap:12px}
.seq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:60px 1fr;gap:14px}
.seq .n{font:600 34px/1 var(--f-display);color:var(--ochre);font-variant-numeric:tabular-nums}
.seq h3{font-size:19px}
.seq .sup{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);min-width:150px;flex:1;max-width:260px}
.act:hover{border-color:var(--accent);background:var(--accent-soft)}
.act b{font-size:14.5px}
.act small{color:var(--muted);font-size:12.5px;line-height:1.35}
.act.ed{border-color:var(--good)}
/* document (fiche) */
.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.doclayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.doclayout.solo{grid-template-columns:minmax(0,1fr)}
.doc{background:#fff;color:#16203a;border:1px solid var(--line);border-radius:6px;padding:34px 38px;box-shadow:0 1px 0 rgba(0,0,0,.03);font:400 15px/1.5 "Source Sans 3",Calibri,Arial,sans-serif;max-width:900px;margin:0 auto;width:100%}
.doc h1{font:700 22px/1.2 "Source Sans 3",Calibri,Arial,sans-serif;text-align:center;margin:8px 0 2px;color:#1b2b6b}
.doc h2{font:700 15.5px/1.3 "Source Sans 3",Calibri,Arial,sans-serif;margin:18px 0 6px;color:#1b2b6b;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #1b2b6b;padding-bottom:3px}
.doc .ent{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;font-size:12.5px;line-height:1.35;border-bottom:1px solid #c9cfdd;padding-bottom:10px}
.doc .ent .ar{text-align:right;direction:rtl;font-family:"Noto Naskh Arabic","Traditional Arabic",Arial,sans-serif;font-size:13.5px}
.doc .ent .mid{text-align:center;font-weight:700}
.doc .sub{text-align:center;color:#55607a;font-size:13.5px;margin-bottom:10px}
.doc table{width:100%;border-collapse:collapse;margin:6px 0}
.doc th,.doc td{border:1px solid #9aa3b8;padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:#e8ecf7;font-weight:700;color:#1b2b6b}
.doc td.lab{background:#f4f6fb;font-weight:700;width:26%;color:#1b2b6b}
.doc ul,.doc ol{margin:4px 0;padding-left:22px}
.doc .qcm{display:grid;gap:6px;margin:4px 0}
.doc .qcm div{break-inside:avoid}
.doc .qcm span{display:inline-block;margin-right:14px}
.doc .small{font-size:12.5px;color:#55607a}
.doc .corr{background:#f6f8ee;border:1px dashed #9db06a;padding:8px 10px;border-radius:4px;margin-top:6px}
[contenteditable]{outline:none;border-radius:3px;min-height:1.2em}
.editing [contenteditable]:hover{background:#fff8e4;box-shadow:0 0 0 1px #e9c97a}
.editing [contenteditable]:focus{background:#fff4d3;box-shadow:0 0 0 2px #d9a63a}
.ctl{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.ctl button{border:1px solid #c9cfdd;background:#fff;border-radius:5px;font-size:12px;padding:1px 6px;color:#1b2b6b}
.side-panel{position:sticky;top:70px;display:grid;gap:12px}
.check{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.check h3{font-size:18px;margin-bottom:6px}
.score{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--f-display);font-variant-numeric:tabular-nums;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.ck{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ck .m{font-weight:700}
.ck.ok .m{color:var(--good)}.ck.no .m{color:var(--bad)}
.ck small{display:block;color:var(--muted);font-size:12.5px}
.analysis{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.dom .tr i{background:var(--ochre)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.ex .q{font-weight:600}
.ex .opts{display:flex;gap:8px;flex-wrap:wrap}
.ex .opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.ex .opts button.ok{background:var(--good);border-color:var(--good);color:#fff}
.ex .opts button.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ex .fb{font-size:14.5px;color:var(--muted)}
.cours{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;max-width:80ch}
.cours ul{padding-left:20px}
.cal{display:grid;gap:8px}
.cal .ev{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cal .ev.past{opacity:.55}
.cal .ev.next{border-color:var(--ochre);box-shadow:inset 5px 0 0 var(--ochre)}
.cal .ev .d{font-variant-numeric:tabular-nums;font-weight:600}
.edt{display:grid;grid-template-columns:90px repeat(6,1fr);gap:4px;font-size:13.5px}
.edt div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:34px}
.edt .h{background:var(--sunk);font-weight:700;text-align:center}
.edt .c{background:var(--accent-soft);border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(10,14,28,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px}
.modal .box h2{font-size:22px}
.qr{background:#fff;padding:10px;border-radius:10px;width:220px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:92vw}
.empty{border:2px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}
.notes input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.notes td.avg{font-weight:700;font-variant-numeric:tabular-nums}
.badge-ok{color:var(--good);font-weight:700}
.badge-ko{color:var(--bad);font-weight:700}
@media (max-width:1100px){.doclayout{grid-template-columns:1fr}.side-panel{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:30}
  .topbar b{font:600 22px var(--f-display)}
  .topbar b i{font-style:normal;color:var(--ochre)}
  .topbar button{background:transparent;border:1px solid #3a4670;color:#fff;border-radius:8px;padding:5px 10px}
  main{padding:18px 16px 60px}
  .hero{grid-template-columns:1fr;padding:22px}
  .doc{padding:20px 16px}
  .doc .ent{grid-template-columns:1fr}
  .doc .ent .ar{text-align:left;direction:rtl}
  .seq{grid-template-columns:1fr}
  .cal .ev{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .side,.topbar,.toolbar,.side-panel,.noprint,.ctl,.toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .doclayout{display:block}
  .doc{border:0;box-shadow:none;padding:0;max-width:none}
  .editing [contenteditable]:hover{background:none;box-shadow:none}
  .doc h2,.doc table{break-inside:auto}
  .doc tr{break-inside:avoid}
}
</style>
</head>

<script>/* Programme de français du cycle secondaire qualifiant, reconstruit à partir des projets de l’enseignant
   (dossier « Cours ») et des orientations pédagogiques de 2007. Champs d’une séquence :
   t titre, sup support, obj objectif de lecture, q axes de lecture, syn synthèse, lg notion de langue (exercices),
   lgT intitulé de langue du projet, lo objectif de langue, or oral [type, sujet], ec écrit [type, sujet], d durées. */
const PROGRAM = [
{ id:"tc", name:"Tronc commun", short:"TC", tahaddi:"Tronc commun",
  intro:"Mise à niveau par la typologie textuelle, La Ficelle, Le Chevalier double et Le Bourgeois gentilhomme.",
  modules:[
  { id:"tc-m1", t:"Mise à niveau et consolidation des acquis antérieurs", o:"Typologie textuelle", a:"Textes variés", d:"", g:"Corpus de textes", sem:"S1",
    src:"Projet « Genres et types de textes » et plan annuel (dossier Typologie textuelle)", dur:"7 semaines : évaluation diagnostique, 5 séquences, contrôles",
    obj:"Mise à niveau et consolidation des acquis antérieurs.",
    comp:["Reconnaître le genre d’un texte (romanesque, théâtral, poétique…).","Identifier les caractéristiques des principaux types de textes.","Produire un écrit cohérent et conforme à une intention de communication précise.","Prendre la parole devant le groupe."],
    ctx:["Semaine 1 : évaluation diagnostique","Une semaine par séquence : lecture, langue, oral, production écrite","Semaine 7 : contrôles de fin de module"],
    seqs:[
     {t:"Les genres de textes", sup:"Corpus d’extraits de genres différents (roman, théâtre, poésie, autobiographie, image)",
      obj:"Reconnaître les genres textuels et identifier leurs marques.",
      q:["Classez les extraits selon leur forme : prose, vers, dialogue théâtral.","Relevez dans chaque extrait deux indices qui permettent de reconnaître son genre.","Quel extrait raconte une histoire vécue par l’auteur lui-même ? Justifiez.","Quels éléments de mise en page signalent un texte de théâtre ? un poème ?","Construisez un tableau récapitulatif : genre, forme, indices."],
      syn:"Le genre renvoie à la forme d’un texte : roman et nouvelle (récit en prose), théâtre (répliques et didascalies), poésie (vers, strophes), autobiographie (récit de sa propre vie). Chaque genre se reconnaît à des indices de forme.",

      obj:"Identifier les caractéristiques d’un texte narratif.",
      q:["Qui raconte l’histoire ? Le narrateur participe-t-il aux événements ?","Relevez les indicateurs de temps qui organisent le récit.","Quel événement rompt l’équilibre de départ ?","Relevez les verbes au passé simple et à l’imparfait : quel rôle joue chaque temps ?","Reconstituez le schéma narratif du texte."],
      syn:"Le texte narratif raconte une suite d’événements organisés dans le temps autour de personnages. Il emploie le passé simple pour les actions et l’imparfait pour l’arrière-plan, et suit souvent le schéma narratif.",

      syn:"Le texte descriptif représente un lieu, un objet ou un personnage selon un ordre précis. Il emploie surtout l’imparfait et de nombreux caractérisants, en particulier les adjectifs qualificatifs.",

      or:["Activité orale","Décrire oralement un personnage, un lieu ou un objet."],

      syn:"Le texte argumentatif défend une thèse à l’aide d’arguments illustrés par des exemples. Les liens logiques organisent le raisonnement.",
      lg:"connecteurs", lgT:"Les liens logiques", lo:"Identifier et employer les liens logiques.",
      or:["Débat","La femme dans la société : débat organisé en deux camps."],
      ec:["Texte argumentatif","Un ami veut quitter l’école. Rédigez un texte argumentatif pour le convaincre de continuer ses études."]},

      q:["À qui s’adresse le texte ? Que cherche-t-il à obtenir ?","Relevez les verbes à l’impératif et les autres marques de l’ordre.","Comment le texte est-il présenté (liste, étapes, numéros) ?","Distinguez les ordres, les conseils et les interdictions.","Dans quelles situations de la vie rencontre-t-on ce type de texte ?"],

  { id:"tc-m2", t:"Étudier une nouvelle réaliste", o:"La Ficelle", a:"Guy de Maupassant", d:"1883", g:"Nouvelle réaliste", sem:"S1",
    src:"Projet séquentiel – La Ficelle de Guy de Maupassant (2026)", dur:"8 semaines, 32 heures (4 h par semaine)",
    obj:"Reconnaître les caractéristiques de la nouvelle réaliste et produire un récit cohérent structuré selon le schéma narratif.",
    comp:["Lecture : identifier la structure d’un récit et la fonction de chaque étape ; repérer les procédés de l’écriture réaliste.","Langue : employer les temps du récit, les indicateurs de temps, le discours rapporté et les registres de langue.","Oral : présenter un exposé, raconter un événement, jouer une scène, défendre un point de vue.","Production écrite : rédiger un récit réaliste complet en cinq étapes, le réviser et l’améliorer."],
    ctx:["Entrée retenue : le schéma narratif","Projet d’écriture filé : une personne accusée à tort à cause d’un malentendu (15 à 20 lignes)","Lecture complémentaire possible : « Aux champs »","Prolongement : l’ode et la chanson"],
    seqs:[
     {t:"Entrer dans l’œuvre", sup:"Paratexte, contrôle de lecture, le schéma narratif",
      obj:"Situer l’auteur, définir le réalisme et le genre de la nouvelle ; reconstituer l’histoire.",
      q:["Que suggère le titre « La Ficelle » ?","Qui est Maupassant ? À quel mouvement appartient-il ?","Qui sont les personnages ? Où et quand se passe l’histoire ?","Qu’est-ce qu’une nouvelle réaliste ?","Formulez une hypothèse sur le sens du titre."],
      syn:"« La Ficelle » (1883) est une nouvelle réaliste : un récit bref, situé dans la Normandie paysanne, qui montre comment un geste banal, mal interprété, détruit un homme.",
      lg:"schema", lgT:"Le schéma narratif (outil d’analyse)", lo:"Nommer les cinq étapes du schéma narratif et reconnaître le passage d’une étape à l’autre.",
      or:["Activité orale","Reconstituer l’histoire à partir de cinq bandes de résumé données dans le désordre, puis justifier l’ordre."],
      ec:["Fiche d’identité","Complétez la fiche d’identité de l’œuvre et le tableau vierge du schéma narratif."]},
     {t:"Un jour de marché à Goderville", sup:"« Sur toutes les routes autour de Goderville… particulière aux gens des champs. »",
      obj:"Étudier la fonction de la situation initiale et identifier la description réaliste.",
      q:["Où et quand se passe la scène ? Quels mots le précisent ?","Comment les corps et les vêtements des paysans sont-ils décrits ? Que révèle la description sur leur vie ?","Quels sens sont sollicités (vue, ouïe, odorat) ?","Pourquoi hommes et bêtes sont-ils mêlés dans la description ?","Pourquoi le héros n’apparaît-il pas encore ?"],
      syn:"La situation initiale présente un monde stable et ordinaire, décrit à l’imparfait avec une grande précision. Le narrateur montre d’abord le milieu qui jugera le héros.",
      lg:"caracterisation", lgT:"L’imparfait de description et les expansions du nom", lo:"Conjuguer à l’imparfait et enrichir un groupe nominal.",
      or:["Lecture et analyse de l’image","Décrire un tableau réaliste de scène de marché et le comparer au souk hebdomadaire de sa région."],
      ec:["Projet d’écriture, étape 1","Rédigez la situation initiale de votre récit : le lieu (souk, quartier, douar), le moment, le personnage (4 à 5 lignes, à l’imparfait)."]},
     {t:"Un bout de ficelle", sup:"« Maître Hauchecorne, de Bréauté, venait d’arriver… courbé en deux par ses douleurs. »",
      obj:"Identifier l’élément perturbateur et sa fonction.",
      q:["Que sait-on de Maître Hauchecorne (origine, caractère, rhumatismes) ?","Quelles actions s’enchaînent ? À quel temps sont-elles racontées ?","Qui est Malandain ? Pourquoi son regard est-il important ?","Pourquoi Hauchecorne a-t-il honte et cache-t-il sa trouvaille ?","En quoi ce réflexe le rend-il suspect ?"],
      syn:"L’élément perturbateur rompt l’équilibre initial. Il est raconté au passé simple et introduit par un indicateur de rupture. Ce n’est pas le geste qui est grave, mais la façon dont il est vu et dissimulé.",
      lg:"temps", lgT:"Imparfait et passé simple ; les indicateurs de rupture", lo:"Distinguer les valeurs des deux temps et conjuguer les verbes usuels au passé simple.",
      or:["Récit oral","Raconter un incident : « Un jour, un geste banal a été mal compris… » (2 minutes)."],
      ec:["Projet d’écriture, étape 2","Introduisez l’élément perturbateur : le geste ou l’incident mal interprété (2 à 3 lignes, au passé simple)."]},
     {t:"De l’accusation à la rumeur", sup:"Extrait A : « Tout à coup le tambour roula… demander des ordres. » ; extrait B : « La nouvelle s’était répandue… au milieu des moqueries. »", d:{lecture:"2 heures",ecrit:"2 heures"},
      obj:"Suivre l’enchaînement des péripéties et comprendre l’aggravation du conflit.",
      q:["Quelles actions mènent du roulement de tambour à la mairie ?","Comment parlent le maire et le paysan ? Qui est cru, et pourquoi ?","Pourquoi la ficelle montrée au maire ne convainc-t-elle personne ?","Pourquoi, plus Hauchecorne raconte son histoire, moins on le croit ?","Que change le retour du portefeuille ? Que signifie « Gros malin, va ! » ?"],
      syn:"Les péripéties sont les actions provoquées par l’élément perturbateur. Chaque tentative du héros pour se justifier aggrave sa situation : la rumeur est plus forte que la vérité.",
      lg:"discours", lgT:"Le discours direct et indirect ; les registres de langue", lo:"Rapporter des paroles dans un récit et identifier les registres de langue.",
      or:["Jeu de rôle","L’interrogatoire à la mairie : le maire, Hauchecorne, Malandain, le brigadier, des témoins."],
      ec:["Projet d’écriture, étape 3","Rédigez les péripéties avec un court dialogue : l’accusation, la défense, la réaction des autres (5 à 6 lignes)."]},
     {t:"L’innocence impossible", sup:"« Il rentra chez lui, honteux et indigné… Il dépérissait à vue d’œil. »",
      obj:"Identifier l’élément de résolution et sa particularité : une résolution négative.",
      q:["Quels mots disent la honte et la colère ? Comment évoluent-ils dans l’extrait ?","Pourquoi son innocence lui paraît-elle impossible à prouver ?","Quel rôle joue sa réputation de malin ?","Que devient son récit de jour en jour ? Quel effet produit-il sur les autres ?","Le narrateur connaît-il les pensées du personnage ? Justifiez."],
      syn:"L’élément de résolution met fin aux péripéties. Ici il est négatif : le héros n’est pas innocenté et le récit bascule de l’action vers la souffrance intérieure.",
      lg:"causecons", lgT:"Le lexique des sentiments ; la cause et la conséquence", lo:"Exprimer un état intérieur et relier deux faits par un rapport de cause ou de conséquence.",
      or:["Débat","Une rumeur peut-elle détruire une personne ? De Goderville aux réseaux sociaux."],
      ec:["Projet d’écriture, étape 4","Rédigez l’élément de résolution de votre récit en exprimant les sentiments du personnage (2 à 3 lignes)."]},
     {t:"« Une ’tite ficelle »", sup:"« Les plaisants maintenant… t’nez, la voilà, m’sieu le Maire. »",
      obj:"Étudier la situation finale, la chute et la visée de la nouvelle.",
      q:["Que font les « plaisants » ? Qu’est devenue l’histoire de Hauchecorne pour les autres ?","Combien de temps s’écoule dans ces lignes ? Pourquoi le narrateur va-t-il si vite ?","Que répète le mourant ? Quel lien avec le titre ?","Comparez l’état initial et l’état final.","Quelle critique la nouvelle porte-t-elle sur la société ?"],
      syn:"La situation finale installe un nouvel état : la mort d’un innocent. La chute renvoie au titre. La nouvelle réaliste montre comment la médisance et le préjugé d’une petite société peuvent tuer.",
      lg:"rythme", lgT:"Le rythme du récit : l’ellipse et le sommaire", lo:"Repérer et produire une accélération du récit.",
      or:["Récit oral","Imaginer une autre fin et la raconter ; la classe choisit la plus vraisemblable."],
      ec:["Projet d’écriture, étape 5","Rédigez la situation finale, relisez le récit entier avec la grille et mettez-le au propre."]}
    ],
    qcm:[
     ["Qui est l’auteur de « La Ficelle » ?",["Guy de Maupassant","Gustave Flaubert","Émile Zola","Théophile Gautier"],0],
     ["Comment s’appelle le héros ?",["Maître Hauchecorne","Maître Malandain","Maître Houlbrèque","Marius Paumelle"],0],

     ["Qui voit Hauchecorne ramasser la ficelle ?",["Malandain, son ennemi","Le maire","Le brigadier","Sa femme"],0],
     ["De quoi Hauchecorne est-il accusé ?",["D’avoir ramassé un portefeuille perdu","D’avoir volé une bête","D’avoir menti au maire","D’avoir frappé Malandain"],0],
     ["Comment se termine la nouvelle ?",["Hauchecorne meurt en clamant son innocence","Hauchecorne est innocenté","Malandain avoue","Hauchecorne quitte le village"],0]],
    pe:["Une rumeur peut-elle détruire une personne ? Rédigez un texte argumentatif.","Dans votre village ou votre quartier, une personne est accusée à tort à cause d’un malentendu. Racontez son histoire en respectant les cinq étapes du schéma narratif."]},

  { id:"tc-m3", t:"Étudier une nouvelle fantastique", o:"Le Chevalier double", a:"Théophile Gautier", d:"1840", g:"Nouvelle fantastique", sem:"S2",
    src:"Projet séquentiel : Le Chevalier double de Théophile Gautier et fiches de séquences 0 à V", dur:"8 semaines, 32 heures (4 h par semaine)",
    obj:"Reconnaître les caractéristiques de la nouvelle fantastique et produire un récit fantastique structuré selon le schéma narratif.",
    comp:["Lecture : identifier la structure d’un récit qui ne suit pas l’ordre chronologique ; repérer les procédés du fantastique.","Langue : repérer le retour en arrière, exprimer l’opposition, employer comparaison et métaphore, exprimer le doute, la peur et le conseil.","Oral : décrire une image, raconter une histoire étrange en créant le suspense, débattre, comparer deux œuvres.","Production écrite : rédiger un récit fantastique complet en cinq étapes, le réviser et l’améliorer."],
    ctx:["Réinvestissement des acquis du module sur La Ficelle","Projet d’écriture filé : un inconnu frappe à la porte d’une maison isolée un soir d’orage","Point de vigilance : la fin heureuse et la morale rapprochent la nouvelle du merveilleux"],
    seqs:[
     {t:"Entrer dans l’œuvre", sup:"Exposés, paratexte et contrôle de lecture",
      obj:"Situer l’auteur, définir le genre fantastique ; reconstituer l’ordre de l’histoire.",
      q:["Que suggère le titre « Le Chevalier double » ?","Qui est Théophile Gautier ?","Qui sont les personnages ? Où et quand se passe l’histoire ?","Qu’est-ce que le fantastique ? En quoi se distingue-t-il du merveilleux ?","Dans quel ordre l’histoire est-elle racontée ?"],
      syn:"« Le Chevalier double » raconte l’histoire d’Oluf, jeune seigneur du Nord né sous une étoile double après le passage d’un mystérieux étranger. Partagé entre le bien et le mal, il ne trouve le bonheur qu’après avoir vaincu son propre double.",
      lg:"modalisation", lgT:"Le récit fantastique : réel, étrange, hésitation", lo:"Distinguer le réaliste, le fantastique et le merveilleux et repérer les indices du fantastique.",
      or:["Activité orale","Reconstituer l’histoire dans l’ordre chronologique à partir de six bandes de résumé."],
      ec:["Fiche d’identité","Complétez la fiche d’identité de l’œuvre et le tableau du schéma narratif."]},
     {t:"L’arrivée de l’étranger", sup:"« Qui rend donc la blonde Edwige si triste ?… dans l’angle de la fenêtre. »",
      obj:"Étudier un incipit fantastique et distinguer situation initiale et élément perturbateur.",
      q:["Dans quelle attitude Edwige est-elle montrée ? À quoi est-elle comparée ?","Quelle bonne nouvelle le narrateur rappelle-t-il pourtant ?","Comment l’étranger arrive-t-il au château ? Quel temps fait-il ?","Quels détails rendent son portrait inquiétant ?","Pourquoi le récit commence-t-il par la tristesse d’Edwige avant d’en donner la cause ?"],
      syn:"L’incipit ne suit pas l’ordre chronologique : il montre la tristesse d’Edwige, puis revient en arrière. On y trouve la situation initiale et l’élément perturbateur : l’arrivée, une nuit de tempête, d’un étranger au charme inquiétant.",
      lg:"retour", lgT:"L’ordre du récit : le retour en arrière ; les indicateurs de temps", lo:"Repérer un retour en arrière et employer les temps et indicateurs qui le signalent.",
      or:["Lecture et analyse de l’image","Décrire un château sous la tempête en créant une atmosphère inquiétante."],
      ec:["Projet d’écriture, étape 1","Rédigez la situation initiale et l’élément perturbateur : le lieu, le personnage, l’arrivée de l’inconnu (5 à 6 lignes)."]},
     {t:"L’enfant à l’étoile double", sup:"« Edwige est mère… sur son cœur percé à jour. »",
      obj:"Identifier la première péripétie et relever les signes de la dualité du héros.",
      q:["Comment l’enfant est-il décrit à sa naissance ?","Quel détail vient troubler ce portrait ? Quel mot l’introduit ?","Que révèle l’étoile double, verte et rouge ?","Quels indices du fantastique repère-t-on ?","Quelles oppositions traduisent la double nature d’Oluf ?"],
      syn:"La naissance d’Oluf est la conséquence de la visite de l’étranger. Deux signes en font un être double : son regard noir dans un visage blanc et son étoile verte et rouge. Le fantastique repose sur un fait inexplicable mais vérifié.",
      lg:"opposition", lgT:"L’expression de l’opposition et l’antithèse", lo:"Repérer et employer les outils de l’opposition ; identifier une antithèse et son effet.",
      or:["Débat","Notre caractère est-il fixé dès la naissance ?"],
      ec:["Projet d’écriture, étape 2","Rédigez un premier fait étrange en opposant l’apparence normale et le détail inquiétant (2 à 3 lignes)."]},
     {t:"Le voyage et la condition de Brenda", sup:"Extrait 3 : « Un jour Oluf appelle Dietrich… plus compliqués et plus variés. » ; extrait 4 : « Seigneur Oluf, que vous avez tardé !… s’il pouvait le rencontrer. »", d:{lecture:"2 heures",ecrit:"2 heures"},
      obj:"Étudier un décor fantastique et un dialogue révélant le double.",
      q:["Que demande Oluf à Dietrich ? Quels dangers l’écuyer énumère-t-il ?","Comment Oluf répond-il à chaque danger ?","Par quelles images la forêt se peuple-t-elle de présences étranges ?","Par quelles paroles Brenda accueille-t-elle Oluf ? Quel reproche lui fait-elle ?","Quelle épreuve Brenda impose-t-elle au héros ?"],
      syn:"Le voyage d’Oluf est une péripétie où le fantastique naît du regard porté sur le décor : comparaisons, métaphores et tournures comme « on dirait » peuplent la forêt d’êtres étranges. Brenda révèle ensuite le double et fixe l’épreuve.",
      lg:"figures", lgT:"La comparaison, la métaphore et la personnification ; l’expression du doute", lo:"Identifier les figures d’analogie et les modalisateurs du doute, puis les employer.",
      or:["Récit oral","Raconter une histoire étrange en créant le suspense."],
      ec:["Projet d’écriture, étape 3","Rédigez les péripéties : les faits étranges se multiplient et le personnage hésite (5 à 6 lignes)."]},
     {t:"Le combat contre le double", sup:"« Malgré l’accueil sévère de Brenda… le spectre jeta un grand cri et disparut. »",
      obj:"Identifier l’élément de résolution et interpréter la figure du double.",
      q:["Que pense Oluf des paroles de Brenda en se mettant en route ?","Quel temps fait-il ? À quelle autre scène cela fait-il penser ?","Comment le chevalier rouge est-il décrit ? Que comprend Oluf ?","Par quels procédés la révélation est-elle retardée ?","Que symbolise la victoire d’Oluf sur son double ?"],
      syn:"Le combat met fin au conflit qui déchire Oluf depuis sa naissance. L’adversaire est le reflet exact du héros : chaque coup porté le blesse lui-même. La révélation retardée crée le suspense.",
      lg:"peur", lgT:"Le lexique de la peur et de l’étrange ; la phrase exclamative", lo:"Nommer et graduer la peur ; exprimer la surprise et l’effroi.",
      or:["Lecture expressive","Mettre en voix la scène du combat en adaptant le rythme et l’intensité."],
      ec:["Projet d’écriture, étape 4","Rédigez l’élément de résolution : le personnage affronte ce qui lui fait peur (3 à 4 lignes)."]},
     {t:"L’étoile verte", sup:"« La spirale de corbeaux remonta dans le ciel… moitié nageant, moitié volant. »",
      obj:"Étudier la situation finale, dégager la morale et discuter le genre.",
      q:["Que font les corbeaux après le combat ? Que signifie leur départ ?","Quel accueil Oluf reçoit-il cette fois de Brenda ?","Comparez cette nuit aux autres nuits de la nouvelle.","Quels signes s’inversent à la fin ?","Fantastique ou merveilleux ? Justifiez à partir de la morale."],
      syn:"L’excipit rétablit un équilibre meilleur qu’au début : la tempête laisse place à une nuit claire, l’étoile rouge s’efface, l’œil noir devient bleu. La morale explicite rapproche la nouvelle du conte.",
      lg:"ordre", lgT:"L’impératif et l’expression du conseil", lo:"Conjuguer à l’impératif et exprimer le conseil, l’ordre et la défense.",
      or:["Exposé comparatif","Comparer « La Ficelle » et « Le Chevalier double » : réaliste et fantastique."],
      ec:["Projet d’écriture, étape 5","Rédigez la situation finale, révisez le récit avec la grille et mettez-le au propre."]}

types:{t:"Les types de textes et leurs indices", lv:["tc"],
 c:"<p>Le <b>type</b> d’un texte dépend de sa visée. On le reconnaît à des indices linguistiques.</p><ul><li><b>Narratif</b> (raconter) : passé simple et imparfait, indicateurs de temps, personnages, actions.</li><li><b>Descriptif</b> (montrer) : imparfait, adjectifs, compléments du nom, indicateurs de lieu.</li><li><b>Argumentatif</b> (convaincre) : thèse, arguments, exemples, connecteurs logiques, marques de jugement.</li><li><b>Injonctif</b> (faire agir) : impératif, infinitif, « il faut », « devoir ».</li><li><b>Explicatif</b> (faire comprendre) : présent de vérité générale, vocabulaire technique, connecteurs de cause.</li></ul><p>Un texte mêle souvent plusieurs types : on cherche le type <b>dominant</b>.</p>",
 x:[{q:"« Mélangez la farine et le sucre, puis ajoutez deux œufs. » Type de texte ?",t:"qcm",o:["Injonctif","Narratif","Descriptif","Argumentatif"],k:0,e:"Impératif (mélangez, ajoutez) : le texte fait agir."},
  {q:"« La maison était basse, couverte de tuiles rousses, entourée d’un jardin. » Type de texte ?",t:"qcm",o:["Descriptif","Injonctif","Argumentatif","Explicatif"],k:0,e:"Imparfait et caractérisants : on décrit un lieu."},

temps:{t:"Les temps du récit et leurs valeurs", lv:["tc","1bac"],
 c:"<p>Dans un récit au passé :</p><ul><li><b>Le passé simple</b> exprime les actions de premier plan, limitées et successives : « Il ouvrit la porte et sortit. »</li><li><b>L’imparfait</b> exprime l’arrière-plan : description, habitude, action en cours. « Il pleuvait ; chaque soir, il lisait. »</li><li><b>Le plus-que-parfait</b> exprime une action antérieure à une autre action passée.</li></ul><p>Le <b>présent</b> peut aussi servir de présent de narration (rendre l’action vivante) ou de vérité générale.</p>",
 x:[{q:"« Le soleil brillait quand le cavalier arriva. » Quelle est la valeur de « brillait » ?",t:"qcm",o:["Arrière-plan (description)","Action brève","Habitude","Action antérieure"],k:0,e:"L’imparfait pose le décor sur lequel survient l’action."},
  {q:"« Tous les matins, ma mère se levait avant l’aube. » Valeur de l’imparfait ?",t:"qcm",o:["Habitude","Action brève","Description","Vérité générale"],k:0,e:"« Tous les matins » indique la répétition."},
  {q:"Conjuguez au passé simple : « Ils (prendre) la route et (venir) jusqu’au village. »",a:"Ils prirent la route et vinrent jusqu’au village."},

caracterisation:{t:"La caractérisation : les expansions du nom", lv:["tc"],
 c:"<p>Le nom peut être enrichi par des <b>expansions</b> :</p><ul><li><b>l’adjectif qualificatif épithète</b> : une <i>vieille</i> maison ;</li><li><b>le complément du nom</b> : une maison <i>de pierre</i> ;</li><li><b>la proposition subordonnée relative</b> : une maison <i>qui domine la vallée</i> ;</li><li><b>l’apposition</b> : <i>Vieille et silencieuse</i>, la maison…</li></ul><p>La caractérisation peut être <b>objective</b> (taille, couleur) ou <b>subjective</b> (jugement : sinistre, charmante).</p>",
 x:[{q:"« Une porte de chêne » : « de chêne » est…",t:"qcm",o:["un complément du nom","un adjectif épithète","une relative","une apposition"],k:0,e:"Groupe prépositionnel qui complète le nom."},

connecteurs:{t:"Les connecteurs logiques", lv:["tc","1bac"],
 c:"<p>Les connecteurs organisent le raisonnement :</p><ul><li><b>Addition</b> : et, de plus, en outre, par ailleurs.</li><li><b>Cause</b> : car, parce que, puisque, en effet.</li><li><b>Conséquence</b> : donc, ainsi, par conséquent, c’est pourquoi.</li><li><b>Opposition</b> : mais, pourtant, cependant, en revanche.</li><li><b>Concession</b> : certes… mais, bien que, même si.</li><li><b>Illustration</b> : par exemple, notamment, ainsi.</li><li><b>Énumération</b> : d’abord, ensuite, enfin.</li><li><b>Conclusion</b> : bref, en somme, en conclusion.</li></ul>",

ordre:{t:"L’expression de l’ordre, du conseil et de l’interdiction", lv:["tc"],
 c:"<p>Pour faire agir quelqu’un, on peut employer :</p><ul><li><b>l’impératif</b> : <i>Fermez</i> la porte.</li><li><b>l’infinitif</b> (consignes, recettes) : <i>Ne pas fumer.</i></li><li><b>le futur</b> à valeur d’ordre : Tu <i>rangeras</i> ta chambre.</li><li><b>les verbes devoir, falloir</b> : Il <i>faut</i> partir. Vous <i>devez</i> répondre.</li><li><b>le conditionnel</b> pour adoucir un conseil : Tu <i>devrais</i> te reposer.</li><li><b>la phrase interrogative</b> polie : Pourriez-vous m’aider ?</li></ul>",

discours:{t:"Le discours direct et le discours indirect", lv:["tc","1bac"],
 c:"<p>Le <b>discours direct</b> rapporte les paroles telles quelles, avec des guillemets ou un tiret, après un verbe introducteur.</p><p>Le <b>discours indirect</b> les intègre au récit par une subordonnée : <i>Il dit qu’il viendrait.</i></p><p>Au passage du direct à l’indirect : les pronoms et possessifs changent, les temps se transforment si le verbe introducteur est au passé (présent → imparfait ; futur → conditionnel ; passé composé → plus-que-parfait), les indicateurs changent (aujourd’hui → ce jour-là ; demain → le lendemain).</p>",
 x:[{q:"Passez au discours indirect : Il a dit : « Je pars demain. »",a:"Il a dit qu’il partait le lendemain."},

phrases:{t:"Les types et formes de phrases", lv:["tc"],
 c:"<p><b>Quatre types</b> : déclaratif (affirme), interrogatif (questionne), exclamatif (exprime une émotion), impératif ou injonctif (ordonne).</p><p><b>Formes</b> : affirmative / négative ; active / passive ; neutre / emphatique (mise en relief : <i>C’est lui qui…</i>).</p><p>Au théâtre comme dans le récit, le type de phrase révèle l’état d’esprit du personnage : l’exclamation traduit la colère, la surprise ou l’indignation.</p>",

niveaux:{t:"Les niveaux de langue", lv:["tc","2bac"],
 c:"<ul><li><b>Familier</b> : à l’oral, entre proches ; vocabulaire relâché, syntaxe simplifiée (« J’sais pas », « bosser »).</li><li><b>Courant</b> : usage quotidien, correct et neutre (« Je ne sais pas », « travailler »).</li><li><b>Soutenu</b> : écrits littéraires, situations solennelles ; vocabulaire recherché (« Je l’ignore », « œuvrer »).</li></ul><p>Dans un récit réaliste, reproduire le parler populaire crée un <b>effet de réel</b> et caractérise socialement les personnages.</p>",

modalisation:{t:"La modalisation : certitude, doute, jugement", lv:["tc","1bac"],
 c:"<p>La <b>modalisation</b> exprime l’attitude du locuteur vis-à-vis de ce qu’il dit.</p><ul><li><b>Certitude</b> : sans doute, assurément, il est certain que, je suis sûr que.</li><li><b>Doute</b> : peut-être, sembler, paraître, il est possible que, le conditionnel.</li><li><b>Jugement</b> : adjectifs et adverbes évaluatifs (heureusement, malheureusement, terrible).</li></ul><p>Dans le récit fantastique, les modalisateurs du doute traduisent l’<b>hésitation</b> du personnage face à l’inexplicable.</p>",
 x:[{q:"« Il semblait qu’une ombre glissait sur le mur. » Quel modalisateur ?",t:"qcm",o:["« Il semblait »","« une ombre »","« glissait »","« sur le mur »"],k:0,e:"« Il semblait » exprime l’incertitude."},
  {q:"« Peut-être avait-il rêvé. » Ce modalisateur exprime…",t:"qcm",o:["le doute","la certitude","l’ordre","la cause"],k:0,e:"« Peut-être » marque l’incertitude."},

figures:{t:"Les figures de style", lv:["tc","1bac","2bac"],
 c:"<ul><li><b>Comparaison</b> : rapprochement avec un outil (comme, tel, pareil à) : <i>fort comme un lion</i>.</li><li><b>Métaphore</b> : rapprochement sans outil : <i>ce lion</i> (pour un homme courageux).</li><li><b>Personnification</b> : attribuer des traits humains à une chose.</li><li><b>Antithèse</b> : opposition de deux termes ; <b>oxymore</b> : deux termes opposés unis (<i>boucherie héroïque</i>).</li><li><b>Hyperbole</b> : exagération ; <b>litote</b> : dire moins pour suggérer plus.</li><li><b>Anaphore</b> : répétition d’un mot en début de phrase ou de vers.</li><li><b>Gradation</b> : succession de termes d’intensité croissante.</li></ul>",
 x:[{q:"« Ses yeux brillaient comme des étoiles. »",t:"qcm",o:["Comparaison","Métaphore","Antithèse","Litote"],k:0,e:"Outil de comparaison « comme »."},
  {q:"« Une obscure clarté »",t:"qcm",o:["Oxymore","Hyperbole","Anaphore","Personnification"],k:0,e:"Deux termes contraires unis."},

  {q:"Transformez la comparaison en métaphore : « Cet homme est rusé comme un renard. »",a:"Cet homme est un renard."}]},
theatre:{t:"Le texte théâtral", lv:["tc","1bac"],
 c:"<ul><li><b>Réplique</b> : ce que dit un personnage ; <b>tirade</b> : longue réplique ; <b>monologue</b> : un personnage seul en scène.</li><li><b>Didascalies</b> : indications de mise en scène (en italique) : gestes, ton, décor.</li><li><b>Aparté</b> : ce qu’un personnage dit sans être entendu des autres.</li><li><b>Stichomythie</b> : échange rapide de courtes répliques.</li><li><b>Double énonciation</b> : les personnages se parlent, mais s’adressent aussi au public.</li><li>Découpage : <b>actes</b> et <b>scènes</b> (une scène change à chaque entrée ou sortie).</li></ul>",
 x:[{q:"« (Il se retourne, furieux.) » Il s’agit…",t:"qcm",o:["d’une didascalie","d’une réplique","d’un aparté","d’une tirade"],k:0,e:"Indication de jeu entre parenthèses."},
  {q:"Comment appelle-t-on une longue réplique ?",t:"qcm",o:["Une tirade","Un aparté","Une didascalie","Une scène"],k:0,e:"La tirade est un long discours."},
  {q:"Qu’est-ce qu’un aparté ?",a:"Une réplique qu’un personnage prononce sans être entendu des autres personnages, mais entendu du public."},
  {q:"Qu’est-ce qui provoque un changement de scène ?",t:"qcm",o:["L’entrée ou la sortie d’un personnage","Un changement de décor uniquement","La fin d’une tirade","Un aparté"],k:0,e:"Convention du théâtre classique."},
  {q:"Expliquez la double énonciation.",a:"Les personnages se parlent entre eux, mais l’auteur s’adresse en même temps au public, qui reçoit toutes les répliques."}]},
enonciation:{t:"L’énonciation : discours et récit", lv:["1bac","2bac"],
 c:"<p>La situation d’énonciation répond à : <b>qui parle ? à qui ? où ? quand ?</b></p><ul><li>Énoncé <b>ancré</b> (discours) : marques du locuteur (je, nous), de l’interlocuteur (tu, vous), indicateurs liés au moment de parole (ici, aujourd’hui, demain), temps du présent, passé composé, futur.</li><li>Énoncé <b>coupé</b> (récit) : troisième personne, indicateurs absolus (ce jour-là, le lendemain), passé simple et imparfait.</li></ul><p>Dans l’autobiographie, on distingue le <b>je narrant</b> (l’adulte qui écrit) et le <b>je narré</b> (l’enfant).</p>",
 x:[{q:"« Demain, je partirai. » L’énoncé est…",t:"qcm",o:["ancré dans la situation d’énonciation","coupé de la situation d’énonciation"],k:0,e:"« Demain », « je », futur."},
  {q:"« Le lendemain, il partit. » L’énoncé est…",t:"qcm",o:["coupé de la situation d’énonciation","ancré dans la situation d’énonciation"],k:0,e:"Indicateur absolu, 3e personne, passé simple."},
  {q:"Relevez les indices d’énonciation : « Je vous écris aujourd’hui pour vous remercier. »",a:"Je (locuteur), vous (destinataire), aujourd’hui (moment), présent « écris »."},
  {q:"Qu’est-ce que le « je narrant » dans une autobiographie ?",a:"L’adulte qui écrit au moment de l’écriture et se souvient de son passé."},
  {q:"Transformez en énoncé coupé : « Hier, j’ai vu ton frère ici. »",a:"La veille, il avait vu son frère à cet endroit."}]},
champ:{t:"Le champ lexical, la dénotation et la connotation", lv:["1bac"],
 c:"<p>Un <b>champ lexical</b> est l’ensemble des mots qui se rapportent à un même thème (la mort : tombe, deuil, funèbre, mourir).</p><p>La <b>dénotation</b> est le sens premier d’un mot ; la <b>connotation</b> est l’ensemble des valeurs et impressions qu’il suggère (le « rouge » dénote une couleur, connote la passion, la violence ou le danger).</p><p>Repérer les champs lexicaux dominants permet de dégager le <b>thème</b> et la <b>tonalité</b> d’un texte.</p>",
 x:[{q:"Quel thème réunit : geôle, cachot, barreaux, verrou ?",t:"qcm",o:["La prison","La maison","La guerre","La nature"],k:0,e:"Champ lexical de l’enfermement."},
  {q:"Constituez un champ lexical de la solitude (5 mots).",a:"Exemple : seul, isolé, abandon, silence, vide."},
  {q:"Quelle connotation a le mot « nuit » dans un récit tragique ?",t:"qcm",o:["La mort, l’angoisse","La fête","La lumière","La joie"],k:0,e:"La nuit suggère souvent la mort ou la peur."},
  {q:"Le mot « hiver » dénote une saison. Que peut-il connoter ?",a:"La vieillesse, la tristesse, la mort, le froid des sentiments."},
  {q:"À quoi sert l’étude des champs lexicaux dans un texte ?",a:"À dégager le thème principal et la tonalité du texte, et à justifier une interprétation."}]},
causecons:{t:"L’expression de la cause et de la conséquence", lv:["1bac"],
 c:"<p><b>Cause</b> (pourquoi ?) : parce que, puisque, comme, étant donné que ; à cause de, grâce à, en raison de ; car, en effet.</p><p><b>Conséquence</b> (résultat) : si bien que, de sorte que, si… que, tellement… que ; donc, ainsi, par conséquent, c’est pourquoi ; au point de.</p><p>« Grâce à » introduit une cause positive, « à cause de » une cause souvent négative.</p>",
 x:[{q:"« Il a échoué ___ il n’a pas révisé. »",t:"qcm",o:["parce qu’","si bien qu’","pourtant","donc"],k:0,e:"Rapport de cause."},
  {q:"« Il était ___ fatigué ___ il s’endormit en classe. »",t:"qcm",o:["si… qu’","parce que… donc","car… ainsi","bien que… mais"],k:0,e:"Conséquence avec intensité."},
  {q:"« Grâce à » ou « à cause de » : « Il a réussi ___ son travail. »",t:"qcm",o:["grâce à","à cause de"],k:0,e:"Cause positive."},
  {q:"Exprimez la cause de deux manières : « Le père est parti. Il était ruiné. »",a:"Le père est parti parce qu’il était ruiné. / Ruiné, le père est parti. / Le père est parti en raison de sa ruine."},
  {q:"Exprimez la conséquence : « La mère pleurait beaucoup. Ses yeux étaient rouges. »",a:"La mère pleurait tellement que ses yeux étaient rouges."}]},
opposition:{t:"L’expression de l’opposition et de la concession", lv:["1bac"],
 c:"<p>L’<b>opposition</b> met en parallèle deux faits contraires : mais, pourtant, cependant, en revanche, alors que, tandis que, au contraire.</p><p>La <b>concession</b> admet un fait mais en écarte la conséquence attendue : bien que + subjonctif, quoique, même si, malgré, certes… mais, avoir beau.</p><p>Dans l’argumentation, la concession permet de reconnaître un argument adverse avant de le dépasser.</p>",
 x:[{q:"« ___ il pleuve, nous sortirons. »",t:"qcm",o:["Bien qu’","Parce qu’","Puisqu’","Comme"],k:0,e:"Concession + subjonctif."},
  {q:"« Antigone refuse, ___ Ismène accepte. »",t:"qcm",o:["tandis qu’","parce qu’","donc","si bien qu’"],k:0,e:"Opposition de deux attitudes."},
  {q:"Reformulez avec « avoir beau » : « Même si Créon insiste, Antigone refuse. »",a:"Créon a beau insister, Antigone refuse."},
  {q:"Reformulez avec « malgré » : « Bien qu’elle ait peur, elle continue. »",a:"Malgré sa peur, elle continue."},
  {q:"Quel mode suit « bien que » ?",t:"qcm",o:["Le subjonctif","L’indicatif","Le conditionnel","L’infinitif"],k:0,e:"Bien que + subjonctif."}]},
argumentation:{t:"L’argumentation : thèse, arguments, exemples", lv:["1bac","2bac"],
 c:"<ul><li><b>Le thème</b> : ce dont on parle. <b>La thèse</b> : l’opinion défendue sur ce thème.</li><li><b>L’argument</b> : idée qui justifie la thèse ; <b>l’exemple</b> : fait concret qui illustre l’argument.</li><li><b>La thèse adverse</b> : l’opinion combattue, souvent réfutée.</li><li><b>Plan</b> d’un texte argumentatif : introduction (amorce, problématique, annonce), développement (paragraphes argumentatifs), conclusion (bilan, ouverture).</li><li>Un paragraphe argumentatif : idée directrice → explication → exemple → mini-conclusion.</li></ul><p>On <b>convainc</b> par la raison, on <b>persuade</b> par les sentiments.</p>",
 x:[{q:"« Le sport est bénéfique, car il améliore la santé ; par exemple, la marche réduit les risques cardiaques. » Quel est l’argument ?",t:"qcm",o:["Il améliore la santé","Le sport est bénéfique","La marche réduit les risques cardiaques"],k:0,e:"La thèse est « le sport est bénéfique », l’exemple concerne la marche."},
  {q:"Convaincre, c’est…",t:"qcm",o:["faire appel à la raison","faire appel aux émotions","raconter une histoire","donner un ordre"],k:0,e:"Persuader fait appel aux émotions."},
  {q:"Trouvez un argument et un exemple pour la thèse : « La lecture forme l’esprit. »",a:"Argument : elle développe l’imagination et l’esprit critique. Exemple : un lecteur de romans apprend à comprendre des points de vue différents du sien."},
  {q:"Quelles sont les trois parties d’une introduction ?",a:"Une amorce (entrée en matière), la problématique (question posée), l’annonce du plan."},
  {q:"Rédigez un paragraphe argumentatif pour la thèse « Il faut préserver les traditions ».",a:"Exemple : Il faut préserver les traditions, car elles transmettent l’identité d’un peuple. En effet, les fêtes et les savoir-faire relient les générations. Ainsi, la fête de l’Achoura rassemble les familles autour de rites partagés. Les abandonner, ce serait donc perdre une part de nous-mêmes."}]},
registres:{t:"Les registres : tragique, pathétique, lyrique, comique", lv:["1bac","2bac"],
 c:"<ul><li><b>Tragique</b> : le héros est écrasé par une fatalité ; on éprouve terreur et pitié.</li><li><b>Pathétique</b> : on suscite la pitié du lecteur par la souffrance (champ lexical de la douleur, exclamations, apostrophes, interrogations).</li><li><b>Lyrique</b> : expression des sentiments personnels (première personne, exclamations, musicalité).</li><li><b>Comique</b> : faire rire (comique de mots, de gestes, de situation, de caractère).</li><li><b>Satirique / ironique</b> : se moquer pour critiquer.</li></ul>",
 x:[{q:"Un personnage sait qu’il va mourir et ne peut échapper à son destin : registre ?",t:"qcm",o:["Tragique","Comique","Lyrique","Satirique"],k:0,e:"La fatalité caractérise le tragique."},
  {q:"Quels procédés caractérisent le pathétique ?",a:"Le champ lexical de la souffrance, les exclamations, les interrogations, les apostrophes, la description de détails émouvants."},
  {q:"« Ô temps ! suspends ton vol ! » Registre ?",t:"qcm",o:["Lyrique","Comique","Satirique","Fantastique"],k:0,e:"Apostrophe et expression des sentiments."},
  {q:"Citez les quatre types de comique.",a:"Le comique de mots, de gestes, de situation et de caractère."},
  {q:"Pourquoi Hugo utilise-t-il le pathétique dans « Le Dernier Jour d’un condamné » ?",a:"Pour émouvoir le lecteur et faire de l’émotion un argument contre la peine de mort."}]},
ironie:{t:"L’ironie et la satire", lv:["2bac"],
 c:"<p>L’<b>ironie</b> consiste à dire le contraire de ce que l’on pense pour le faire comprendre (antiphrase) et se moquer.</p><p>Procédés : <b>antiphrase</b>, <b>exagération</b>, <b>fausse naïveté</b> (le personnage candide rapporte des horreurs sans les juger), <b>juxtaposition</b> de faits contradictoires, <b>oxymore</b>, emploi décalé du vocabulaire mélioratif.</p><p>La <b>satire</b> est une critique moqueuse des mœurs, des institutions ou des personnes.</p>",
 x:[{q:"« Quel beau temps ! » dit-il sous une pluie battante. Procédé ?",t:"qcm",o:["Antiphrase","Hyperbole","Comparaison","Litote"],k:0,e:"Dire le contraire de ce que l’on pense."},
  {q:"« Boucherie héroïque » (Candide, ch. III) est…",t:"qcm",o:["un oxymore","une métaphore filée","une litote","une anaphore"],k:0,e:"Deux termes contradictoires unis."},
  {q:"Qu’est-ce que la fausse naïveté ?",a:"Le narrateur ou le personnage rapporte des faits scandaleux comme s’ils étaient normaux, ce qui en révèle l’absurdité."},
  {q:"Quelle est la cible de la satire dans l’incipit de « Candide » ?",a:"La noblesse vaniteuse et la philosophie optimiste de Pangloss."},
  {q:"Rédigez une phrase ironique sur un élève qui arrive très en retard.",a:"Exemple : « Quelle ponctualité exemplaire ! », dit le professeur à l’élève arrivé avec une heure de retard."}]},
reformulation:{t:"La reformulation et le résumé", lv:["2bac"],
 c:"<p><b>Résumer</b>, c’est réduire un texte en conservant ses idées essentielles et leur enchaînement, sans les déformer.</p><ul><li>Lire et repérer la thèse, les arguments et les connecteurs.</li><li>Supprimer les exemples, répétitions et détails secondaires.</li><li><b>Reformuler</b> : synonymes, <b>nominalisation</b> (« il refuse » → « son refus »), <b>généralisation</b> (« pommes, poires » → « fruits »).</li><li>Respecter le système d’énonciation et le nombre de mots demandé, sans ajouter d’opinion personnelle.</li></ul>",
 x:[{q:"Nominalisez : « Le prix augmente. »",a:"L’augmentation du prix."},
  {q:"Généralisez : « Il aime les romans, les poèmes, les pièces de théâtre. »",a:"Il aime la littérature."},
  {q:"Dans un résumé, peut-on donner son avis ?",t:"qcm",o:["Non","Oui","Seulement en conclusion"],k:0,e:"Le résumé reste fidèle et objectif."},
  {q:"Que doit-on conserver dans un résumé de texte argumentatif ?",t:"qcm",o:["La thèse et les arguments","Les exemples","Les citations","Les détails"],k:0,e:"Les exemples sont en général supprimés."},
  {q:"Reformulez en une phrase : « Le travail éloigne de nous trois grands maux : l’ennui, le vice et le besoin. »",a:"Selon l’auteur, travailler protège de l’ennui, de la corruption et de la pauvreté."}]},
valorisant:{t:"Le lexique valorisant et dévalorisant", lv:["2bac"],
 c:"<p>Le vocabulaire peut être <b>neutre</b> (une maison), <b>valorisant ou mélioratif</b> (une demeure accueillante) ou <b>dévalorisant ou péjoratif</b> (une masure).</p><p>Les suffixes (-âtre, -ard : <i>verdâtre, chauffard</i>), les adjectifs, les comparaisons et les adverbes évaluatifs orientent le jugement du lecteur.</p><p>L’analyse du lexique révèle le <b>point de vue</b> du narrateur ou de l’auteur.</p>",
 x:[{q:"« Une bicoque » est un terme…",t:"qcm",o:["dévalorisant","valorisant","neutre"],k:0,e:"Terme péjoratif pour une maison."},
  {q:"Quel suffixe est péjoratif ?",t:"qcm",o:["-âtre (rougeâtre)","-ette (maisonnette)","-tion (création)","-ment (lentement)"],k:0,e:"-âtre donne une nuance péjorative."},
  {q:"Donnez un équivalent valorisant et un équivalent dévalorisant de « cheval ».",a:"Valorisant : coursier, destrier. Dévalorisant : canasson, haridelle."},
  {q:"Réécrivez de manière dévalorisante : « Une petite maison simple au bord du chemin. »",a:"Exemple : Une masure délabrée échouée au bord d’un chemin boueux."},
  {q:"À quoi sert l’étude du lexique valorisant dans un portrait ?",a:"À dégager le point de vue de l’auteur sur le personnage et le jugement qu’il veut faire partager."}]},
procedes:{t:"Les procédés de l’argumentation", lv:["2bac"],
 c:"<ul><li><b>Types d’arguments</b> : argument logique, d’autorité (citer un expert), par l’exemple, par analogie, ad hominem (attaquer la personne).</li><li><b>Stratégies</b> : la concession (reconnaître puis dépasser), la réfutation (rejeter la thèse adverse), la question rhétorique.</li><li><b>Procédés de persuasion</b> : appel aux sentiments, implication du lecteur (« nous », impératif), figures d’insistance (anaphore, gradation).</li><li>L’argumentation peut être <b>directe</b> (essai, discours) ou <b>indirecte</b> (conte, fable, roman).</li></ul>",
 x:[{q:"« Comme l’affirme Rousseau, l’homme naît bon. » Type d’argument ?",t:"qcm",o:["Argument d’autorité","Argument par analogie","Concession","Réfutation"],k:0,e:"On s’appuie sur une autorité reconnue."},
  {q:"« Qui peut accepter que des enfants meurent de faim ? » Procédé ?",t:"qcm",o:["Question rhétorique","Antiphrase","Concession","Litote"],k:0,e:"Question qui n’attend pas de réponse."},
  {q:"Qu’est-ce que l’argumentation indirecte ? Donnez un exemple.",a:"Une argumentation qui passe par un récit (conte, fable, roman). Exemple : « Candide » critique la guerre à travers les aventures du héros."},
  {q:"Rédigez une concession suivie d’une réfutation sur les réseaux sociaux.",a:"Exemple : Certes, les réseaux sociaux rapprochent les gens éloignés ; mais ils isolent souvent ceux qui vivent sous le même toit."},
  {q:"Relevez le procédé : « Le travail, toujours le travail, encore le travail ! »",t:"qcm",o:["La répétition / gradation","La litote","La comparaison","L’euphémisme"],k:0,e:"La répétition insiste sur l’idée."}]},
description:{t:"La description et ses fonctions", lv:["2bac"],
 c:"<p>Dans un roman, la description remplit plusieurs <b>fonctions</b> :</p><ul><li><b>réaliste</b> : créer l’illusion du réel par des détails précis ;</li><li><b>explicative</b> : le lieu éclaire le caractère des personnages (Mme Vauquer « explique » sa pension) ;</li><li><b>symbolique</b> : le décor suggère un sens (misère, enfermement) ;</li><li><b>narrative</b> : elle prépare l’action ou crée une pause ;</li><li><b>esthétique</b> : beauté du style.</li></ul><p>Elle s’organise selon un <b>ordre</b> (spatial, du général au particulier) et un <b>point de vue</b> (narrateur ou personnage).</p>",
 x:[{q:"La description d’une pension sale et pauvre qui annonce la misère de ses habitants a une fonction…",t:"qcm",o:["explicative et symbolique","uniquement esthétique","injonctive","comique"],k:0,e:"Le lieu révèle les personnages."},
  {q:"Citez trois organisateurs spatiaux.",a:"Exemple : au premier plan, à gauche, au fond."},
  {q:"Qu’est-ce que l’effet de réel ?",a:"L’impression de réalité produite par des détails précis, parfois inutiles à l’action, qui authentifient le récit."},
  {q:"Une description faite à travers le regard d’un personnage relève…",t:"qcm",o:["d’une focalisation interne","d’une focalisation zéro","d’une focalisation externe"],k:0,e:"On voit ce que voit le personnage."},
  {q:"Insérez une description de deux phrases dans le récit : « Il entra dans la pièce. »",a:"Exemple : Il entra dans la pièce. Une table bancale occupait le centre, couverte d’une toile cirée tachée ; au fond, une fenêtre étroite laissait filtrer une lumière grise."}]},
schema:{t:"Le schéma narratif", lv:["tc"],
 c:"<p>Le <b>schéma narratif</b> décrit l’organisation d’un récit en cinq étapes :</p><ul><li><b>Situation initiale</b> : présentation du cadre et des personnages ; un équilibre (souvent à l’imparfait).</li><li><b>Élément perturbateur</b> : un événement rompt l’équilibre (passé simple, indicateurs : soudain, un jour, tout à coup).</li><li><b>Péripéties</b> : les actions et épreuves provoquées par l’élément perturbateur.</li><li><b>Élément de résolution</b> : ce qui met fin aux péripéties ; il peut être heureux ou malheureux.</li><li><b>Situation finale</b> : le nouvel équilibre.</li></ul><p>Les indicateurs de temps et les changements de temps verbaux signalent le passage d’une étape à l’autre.</p>",
 x:[{q:"« Un matin, la vieille femme trouva la porte ouverte. » Cette phrase correspond le plus souvent à…",t:"qcm",o:["l’élément perturbateur","la situation finale","la situation initiale","l’élément de résolution"],k:0,e:"Indicateur de rupture et passé simple."},
  {q:"Quel temps domine généralement la situation initiale d’un récit au passé ?",t:"qcm",o:["L’imparfait","Le passé simple","Le futur","Le conditionnel"],k:0,e:"L’imparfait pose le cadre."},
  {q:"Un élément de résolution peut-il être malheureux ?",t:"qcm",o:["Oui","Non"],k:0,e:"Exemple : Hauchecorne ne peut prouver son innocence."},
  {q:"Citez trois indicateurs de temps qui annoncent l’élément perturbateur.",a:"Soudain, tout à coup, un jour (aussi : quand, mais ce jour-là)."},
  {q:"Résumez en cinq phrases, une par étape, une histoire que vous connaissez.",a:"Réponse libre : une phrase pour chaque étape, dans l’ordre du schéma narratif."}]},
rythme:{t:"Le rythme du récit : ellipse, sommaire, scène, pause", lv:["tc"],
 c:"<p>Le narrateur règle la vitesse du récit :</p><ul><li><b>La scène</b> : le temps du récit correspond à peu près au temps de l’histoire (dialogue).</li><li><b>Le sommaire</b> : une longue durée est résumée en quelques lignes (« Pendant des mois, il raconta son histoire »).</li><li><b>L’ellipse</b> : une période est passée sous silence (« Vers la fin de décembre, il s’alita »).</li><li><b>La pause</b> : le récit s’arrête pour une description ou un commentaire.</li></ul><p>L’accélération finale d’une nouvelle prépare souvent la <b>chute</b>.</p>",
 x:[{q:"« Trois ans plus tard, il revint au village. » Procédé ?",t:"qcm",o:["Une ellipse","Une scène","Une pause","Un dialogue"],k:0,e:"Trois années sont passées sous silence."},
  {q:"Un long dialogue rapporté au discours direct correspond à…",t:"qcm",o:["une scène","un sommaire","une ellipse","une pause"],k:0,e:"Le temps du récit suit le temps de l’histoire."},
  {q:"Une description du décor qui interrompt l’action est…",t:"qcm",o:["une pause","une ellipse","un sommaire","une scène"],k:0,e:"L’action est suspendue."},
  {q:"Résumez en une phrase (sommaire) : un élève révise tous les soirs pendant un trimestre.",a:"Exemple : Pendant tout le trimestre, il révisa chaque soir ses leçons."},
  {q:"Pourquoi Maupassant accélère-t-il le récit à la fin de « La Ficelle » ?",a:"Pour montrer la déchéance rapide du héros et rendre la chute plus frappante."}]},
retour:{t:"L’ordre du récit : le retour en arrière", lv:["tc"],
 c:"<p>L’<b>ordre du récit</b> n’est pas toujours celui de l’histoire.</p><ul><li>Le <b>retour en arrière</b> (analepse) raconte un événement antérieur au moment où se trouve le récit : il est souvent signalé par le <b>plus-que-parfait</b> et par des indicateurs comme « quelques mois plus tôt », « autrefois », « ce soir-là ».</li><li>L’<b>anticipation</b> (prolepse) annonce un événement futur.</li></ul><p>Le retour en arrière permet de créer un mystère au début du récit puis d’en donner l’explication.</p>",
 x:[{q:"Quel temps signale souvent un retour en arrière dans un récit au passé ?",t:"qcm",o:["Le plus-que-parfait","Le futur simple","L’impératif","Le présent de vérité générale"],k:0,e:"Il exprime l’antériorité."},
  {q:"« Edwige pleurait. Quelques mois plus tôt, un étranger était venu au château. » Que marque la seconde phrase ?",t:"qcm",o:["Un retour en arrière","Une anticipation","Une ellipse","Une pause"],k:0,e:"« Quelques mois plus tôt » + plus-que-parfait."},
  {q:"Pourquoi un auteur commence-t-il par un effet avant d’en donner la cause ?",a:"Pour créer un mystère et éveiller la curiosité du lecteur."},
  {q:"Rétablissez l’ordre chronologique : « Il pleurait. La veille, il avait perdu son chien. Il l’avait cherché toute la nuit. »",a:"Il perdit son chien, il le chercha toute la nuit, puis le lendemain il pleurait."},
  {q:"Rédigez deux phrases commençant par un fait présent puis revenant en arrière.",a:"Exemple : Le village était silencieux. Trois jours plus tôt, une étrange caravane l’avait traversé."}]},
peur:{t:"Le lexique de la peur et la phrase exclamative", lv:["tc"],

function fval(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],CUR.model)}
function E(path,tag="div",cls=""){const v=fval(path);return `<${tag} class="${cls}" contenteditable="true" spellcheck="true" data-k="${path}">${esc(v??"").replace(/\n/g,"<br>")}</${tag}>`}
function renderFicheDoc(m){
  const id=Object.fromEntries(m.ident);
  let h=entete(m.title,m.sub);
  h+=`<h2>Identification</h2><table>${m.ident.map((r,i)=>`<tr><td class="lab">${esc(r[0])}</td>${E(`ident.${i}.1`,"td")}</tr>`).join("")}</table>`;
  h+=`<h2>Compétence visée</h2>${E("comp")}`;
  h+=`<h2>Objectifs<span class="ctl"><button data-a="add-obj" title="Ajouter un objectif">+</button></span></h2><ul>${(m.obj||[]).map((o,i)=>`<li>${E(`obj.${i}`,"span")}<span class="ctl"><button data-a="del-obj" data-i="${i}" title="Supprimer">×</button></span></li>`).join("")}</ul>`;
  h+=`<table><tr><td class="lab">Prérequis</td>${E("prereq","td")}</tr><tr><td class="lab">Matériel didactique</td>${E("mat","td")}</tr></table>`;
  if(m.text)h+=`<h2>Texte support</h2>${E("text","div","small")}`;
  h+=`<h2>Déroulement<span class="ctl"><button data-a="add-step">+ étape</button></span></h2><table><tr><th style="width:17%">Étape</th><th style="width:7%">Durée (min)</th><th>Activités de l’enseignant</th><th>Activités des élèves</th><th style="width:12%">Modalités</th></tr>`+
   (m.steps||[]).map((s,i)=>`<tr>${E(`steps.${i}.e`,"td")}${E(`steps.${i}.d`,"td")}${E(`steps.${i}.p`,"td")}${E(`steps.${i}.el`,"td")}<td><div contenteditable="true" data-k="steps.${i}.m">${esc(s.m||"")}</div><span class="ctl"><button data-a="del-step" data-i="${i}" title="Supprimer l’étape">×</button></span></td></tr>`).join("")+
   `<tr><td class="lab">Total</td><td colspan="4"><b id="tot">${(m.steps||[]).reduce((a,s)=>a+(+s.d||0),0)} min</b> <span class="small">(durée prévue : ${esc(id["Durée"]||"")})</span></td></tr></table>`;
  h+=`<h2>Synthèse / trace écrite</h2>${E("trace")}`;
  h+=`<h2>Évaluation</h2>`;
  if((m.qcm||[]).length)h+=`<div class="qcm">${m.qcm.map((q,i)=>{const s=shuffleQ(q);return `<div><b>${i+1}. ${esc(s.q)}</b><br>${s.o.map((o,j)=>`<span>${LET[j]}. ${esc(o)}</span>`).join("")}</div>`}).join("")}</div>`;
  h+=E("evalq");
  if((m.grille||[]).length){const t=m.grille.reduce((a,g)=>a+(+g[1]||0),0);h+=`<table><tr><th>Critères d’évaluation</th><th style="width:16%">Barème</th></tr>${m.grille.map((g,i)=>`<tr>${E(`grille.${i}.0`,"td")}${E(`grille.${i}.1`,"td")}</tr>`).join("")}<tr><td class="lab">Total</td><td><b>${t} pts</b></td></tr></table>`}
  h+=`<table><tr><td class="lab">Différenciation / remédiation</td>${E("diff","td")}</tr><tr><td class="lab">Prolongement</td>${E("prolong","td")}</tr></table>`;
  if((m.qcm||[]).length||m.corr){h+=`<div class="corr"><b>Corrigé indicatif</b>${(m.qcm||[]).length?"<br>QCM : "+m.qcm.map((q,i)=>`${i+1}-${LET[shuffleQ(q).k]}`).join(" · "):""}${m.corr?E("corr","div","small"):""}</div>`}
  h+=`<p class="small" style="margin-top:14px"><b>Références :</b> ${(m.refs||[]).map(esc).join(" ; ")}</p>`;
  return h;
}
function renderProjetDoc(m){
  let h=entete(m.title,m.sub);
  h+=`<h2>Identification</h2><table>${m.ident.map((r,i)=>`<tr><td class="lab">${esc(r[0])}</td>${E(`ident.${i}.1`,"td")}</tr>`).join("")}</table>`;
  h+=`<h2>Compétences visées</h2>${E("comp")}<h2>Contexte et repères</h2>${E("ctx")}`;
  h+=`<h2>Contenu et progression</h2><table><tr><th>Séquence</th><th>Lecture (support)</th><th>Langue</th><th>Oral</th><th>Production écrite</th></tr>${m.rows.map((r,i)=>`<tr>${E(`rows.${i}.s`,"td")}${E(`rows.${i}.l`,"td")}${E(`rows.${i}.g`,"td")}${E(`rows.${i}.o`,"td")}${E(`rows.${i}.e`,"td")}</tr>`).join("")}</table>`;
  h+=`<h2>Évaluation et régulation</h2>${E("evalp")}`;
  h+=`<p class="small" style="margin-top:14px"><b>Références :</b> ${(m.refs||[]).map(esc).join(" ; ")}</p>`;
  return h;
}
function setPath(obj,path,val){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const last=ks[ks.length-1];o[last]=typeof o[last]==="number"?(parseFloat(String(val).replace(",","."))||0):val}
let saveT=null;
function onDocInput(e){
  const el=e.target.closest("[data-k]");if(!el||!CUR)return;
  setPath(CUR.model,el.dataset.k,el.innerText.replace(/ /g," ").replace(/\n$/,""));
  if(/^steps\.\d+\.d$/.test(el.dataset.k)){const t=$("#tot");if(t)t.textContent=CUR.model.steps.reduce((a,s)=>a+(+s.d||0),0)+" min"}
  clearTimeout(saveT);saveT=setTimeout(saveCur,500);
}
function saveCur(){if(!CUR)return;CUR.model.edited=Date.now();store.set(CUR.key,CUR.model);const s=$("#savest");if(s)s.textContent="Modifications enregistrées";refreshCheck()}
function refreshCheck(){const p=$("#checkp");if(p&&CUR&&CUR.model.kind==="fiche")p.innerHTML=checkHTML(checkFiche(CUR.model))}
function checkHTML(list){
  const ok=list.filter(c=>c.ok).length,p=Math.round(ok/list.length*100),c=p>=90?"var(--good)":p>=70?"var(--warn)":"var(--bad)";
  return `<h3>Conformité pédagogique</h3><div class="score"><div class="ring" style="--p:${p};--c:${c}"><span>${p}%</span></div><div><b>${ok} critères sur ${list.length}</b><br><span class="help">Repères : OP 2007, note 142/2007.</span></div></div>`+
   list.map(k=>`<div class="ck ${k.ok?"ok":"no"}"><span class="m">${k.ok?"✓":"!"}</span><div>${esc(k.label)}<small>${esc(k.ok?k.why:k.fix)}</small></div></div>`).join("");
}

/* ============ export Word ============ */
function wordDoc(title,inner,font){
  font=font||"Calibri";
  const css=`body{font-family:'${font}',Arial,sans-serif;font-size:11pt;color:#16203a}h1{font-size:16pt;text-align:center;color:#1b2b6b;margin:6pt 0 2pt}h2{font-size:11.5pt;color:#1b2b6b;text-transform:uppercase;border-bottom:1.5pt solid #1b2b6b;margin:12pt 0 4pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #9aa3b8;padding:4pt 6pt;vertical-align:top;font-size:10.5pt}th{background:#e8ecf7;color:#1b2b6b}td.lab{background:#f4f6fb;font-weight:bold;color:#1b2b6b;width:26%}.ent td{border:none;font-size:9pt}.sub{text-align:center;color:#55607a;font-size:9.5pt}.small{font-size:9.5pt;color:#55607a}.corr{border:1px dashed #9db06a;background:#f6f8ee;padding:6pt}.ctl{display:none}`;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(title)}</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page{size:21cm 29.7cm;margin:1.6cm 1.6cm}${css}</style></head><body>${inner}</body></html>`;
}
function docForWord(node){
  const c=node.cloneNode(true);
  c.querySelectorAll(".ctl").forEach(x=>x.remove());
  c.querySelectorAll("[contenteditable]").forEach(x=>x.removeAttribute("contenteditable"));
  const ent=c.querySelector(".ent");
  if(ent){const [l,m,r]=[...ent.children];const t=document.createElement("table");t.className="ent";t.innerHTML=`<tr><td style="width:40%">${l.innerHTML}</td><td style="text-align:center;font-weight:bold">${m.innerHTML}</td><td style="text-align:right;direction:rtl;width:40%">${r.innerHTML}</td></tr>`;ent.replaceWith(t)}
  return c.innerHTML;
}
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase().slice(0,60)}

/* ============ export Tahaddi ============ */
function tahaddiPayload(m){
  const lvl=lvlById(m.level),mod=m.module?findMod(m.module):null;
  const title=(mod?mod.mod.o+" — ":"")+(Object.fromEntries(m.ident)["Séquence"]||"Quiz");
  return JSON.stringify([{id:("mih-"+slug(m.id)).slice(0,60),title:title.slice(0,120),level:lvl?lvl.tahaddi:"Autre",updated:Date.now(),
    questions:(m.qcm||[]).map(q=>{const s=shuffleQ(q);const o=s.o.slice(0,4);while(o.length<4)o.push("");return {type:"qcm",text:s.q,opts:o,ok:s.k,dur:20,img:""}})}]);
}

function nav(){
  const h=decodeURIComponent(location.hash.slice(1))||"accueil",[r,...a]=h.split("/");
  const fm=(r==="module"||r==="fiche"||r==="projet")?findMod(a[0]):null;

  (routes[r]||routes.accueil)(...a);

}
